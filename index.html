<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sintra &amp; Cabo da Roca Bouldering Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #d97706;
      --accent-dark: #b45309;
      --parking: #2563eb;
      --danger: #dc2626;
      --danger-dark: #b91c1c;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: 360px;
      max-width: 90vw;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 1100;
      transition: transform 0.22s ease;
      height: 100%;
    }

    .sidebar.collapsed {
      transform: translateX(-100%);
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      pointer-events: none;
    }

    .sidebar-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #fff;
    }

    .sidebar-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .sidebar-header h1 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .sidebar-header p {
      margin: 3px 0 0;
      font-size: 0.76rem;
      color: #cbd5e1;
    }

    .sidebar-close-btn {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #ffffff;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .sidebar-close-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px 8px;
      text-align: center;
    }

    .stat-val {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      color: #fbbf24;
    }

    .stat-lbl {
      font-size: 0.68rem;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Filters */
    .filters {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f8fafc;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .field select,
    .field input[type="text"] {
      width: 100%;
      padding: 6px 9px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.84rem;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .field select:focus,
    .field input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.15);
    }

    .filter-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      color: var(--text);
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background: #f1f5f9;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background: var(--danger-dark);
    }

    .btn-danger-outline {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: var(--danger-dark);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-danger-outline:hover {
      background: #fee2e2;
    }

    /* List */
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
    }

    .list-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 8px 4px 6px;
    }

    .boulder-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #fff;
      cursor: pointer;
    }

    .boulder-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    .boulder-card.unmapped {
      cursor: default;
      opacity: 0.85;
      background: #fafafa;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-title {
      font-weight: 700;
      font-size: 0.88rem;
      line-height: 1.25;
    }

    .card-sector {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge-gps {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-est {
      background: #fffbeb;
      color: #b45309;
      border: 1px dashed #d97706;
    }

    .badge-nogps {
      background: #e2e8f0;
      color: #475569;
    }

    .card-problems-preview {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .show-more-wrap {
      padding: 6px 0 12px;
      text-align: center;
    }

    .show-more-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .show-more-btn:hover {
      background: #f1f5f9;
    }

    /* Map Area */
    .map-wrapper {
      flex: 1;
      position: relative;
      height: 100%;
      width: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Positioned cleanly below + / - zoom controls with higher z-index */
    .leaflet-top.leaflet-left {
      top: 10px;
      left: 10px;
    }

    .sidebar-toggle {
      position: absolute;
      top: 90px;
      left: 10px;
      z-index: 1050;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-toggle:hover {
      background: #f8fafc;
    }

    /* Move Pin Mode Banner */
    .move-pin-banner {
      display: none;
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1060;
      background: #0f172a;
      color: #fff;
      border-radius: 10px;
      padding: 9px 14px;
      box-shadow: var(--shadow);
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      max-width: calc(100vw - 24px);
    }

    .move-pin-banner.active {
      display: flex;
    }

    /* Legend (no backdrop-filter for 60fps mobile) */
    .map-legend {
      position: absolute;
      bottom: 20px;
      right: 12px;
      z-index: 950;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.78rem;
      box-shadow: var(--shadow);
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .legend-boulder {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .legend-boulder-est {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f59e0b;
      border: 2px dashed #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .legend-parking {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: var(--parking);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    /* Custom Leaflet DivIcons */
    .marker-boulder {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      border: 2.5px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.38);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .marker-boulder.estimated {
      border: 2.5px dashed #ffffff;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      opacity: 0.92;
    }

    .marker-boulder.moving-pin {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      border: 3px solid #ffffff;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.35);
      cursor: grab;
    }

    .marker-parking {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.38);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Interactive Area & Sector Pill Labels */
    .map-pill-wrap {
      display: inline-flex;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }

    .area-pill-badge { display: none !important;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #0f172a;
      color: #ffffff;
      border: 2px solid #fbbf24;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.35);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .area-pill-badge:hover {
      background: #1e293b;
    }

    .area-pill-count {
      background: #fbbf24;
      color: #0f172a;
      border-radius: 999px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 800;
    }

    .sector-pill-badge { display: none !important;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      border: 1.5px solid #0f172a;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .sector-pill-badge:hover {
      background: #fef3c7;
      border-color: #d97706;
    }

    .sector-pill-count {
      background: #0f172a;
      color: #ffffff;
      border-radius: 999px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 700;
    }

    .est-label {
      color: #fbbf24;
      font-weight: 700;
    }

    /* Popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
    }

    .leaflet-popup-content {
      margin: 0;
      width: 330px !important;
      max-width: 86vw;
    }

    .popup-box {
      font-family: inherit;
    }

    .popup-header {
      padding: 11px 14px;
      background: #0f172a;
      color: #fff;
    }

    .popup-header.parking-hdr {
      background: #1e40af;
    }

    .popup-sector {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #fbbf24;
      font-weight: 700;
    }

    .popup-header.parking-hdr .popup-sector {
      color: #bfdbfe;
    }

    .popup-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 2px 0 4px;
    }

    .popup-coords {
      font-size: 0.73rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .popup-coords a {
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
    }

    .popup-coords a:hover {
      text-decoration: underline;
    }

    .popup-body {
      padding: 10px 14px 12px;
      max-height: 52vh;
      overflow-y: auto;
    }

    .problem-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .problem-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px 7px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.84rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .problem-item:last-child {
      border-bottom: none;
    }

    .problem-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .problem-item-desc {
      font-size: 0.75rem;
      color: #475569;
      line-height: 1.35;
      padding-left: 14px;
    }

    .problem-item.highlighted {
      background: #fffbeb;
      font-weight: 600;
    }

    .problem-item.is-line-active {
      background: #fef3c7;
      box-shadow: inset 3px 0 0 #d97706;
      font-weight: 700;
    }

    .grade-pill {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .g-easy { background: #dcfce7; color: #166534; }
    .g-mid  { background: #dbeafe; color: #1e40af; }
    .g-hard { background: #f3e8ff; color: #6b21a8; }
    .g-vhard{ background: #18181b; color: #ffffff; }
    .g-proj { background: #e2e8f0; color: #334155; }

    .popup-thumb-wrap {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .popup-thumb-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .popup-photo-stage-wrap {
      text-align: center;
    }

    .popup-photo-stage {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin: 8px auto;
      line-height: 0;
    }

    .popup-boulder-img {
      max-height: 55vh;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      border-radius: 6px;
      cursor: pointer;
    }

    .topo-svg-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .topo-svg-group {
      pointer-events: all;
      cursor: pointer;
      transition: opacity 0.14s ease;
    }

    .topo-svg-overlay.has-highlight .topo-svg-group:not(.is-highlighted) {
      opacity: 0.28;
    }

    .topo-svg-group .topo-hit-path {
      fill: none;
      stroke: transparent;
      stroke-width: 24;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .topo-svg-group .topo-outline-path {
      fill: none;
      stroke: rgba(255, 255, 255, 0.85);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .topo-svg-group .topo-visible-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .topo-svg-group.is-highlighted .topo-visible-path {
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.95));
    }

    .popup-photo-empty {
      margin-top: 6px;
      padding: 12px 10px;
      border: 1.5px dashed #cbd5e1;
      border-radius: 6px;
      text-align: center;
      font-size: 0.78rem;
      color: #64748b;
      background: #f8fafc;
    }

    .popup-photo-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .popup-photo-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .popup-photo-btn:hover {
      background: #e2e8f0;
    }

    .popup-photo-btn input[type="file"] {
      display: none;
    }

    .popup-reset-photo {
      background: none;
      border: none;
      padding: 2px 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #b91c1c;
      text-decoration: underline;
      cursor: pointer;
    }

    .popup-footer-actions {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3300;
      background: rgba(15, 23, 42, 0.9);
      align-items: center;
      justify-content: center;
      padding: 20px;
      flex-direction: column;
      gap: 12px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-stage {
      position: relative;
      display: inline-block;
      line-height: 0;
      max-width: 95vw;
      max-height: 85vh;
    }

    .lightbox-stage img {
      max-width: 95vw;
      max-height: 85vh;
      width: auto;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      background: #0f172a;
      display: block;
    }

    .lightbox-caption {
      color: #f8fafc;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      border-radius: 999px;
      width: 38px;
      height: 38px;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .popup-description {
      font-size: 0.8rem;
      color: #475569;
      background: #f8fafc;
      border-left: 3px solid #cbd5e1;
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .popup-topo-wrap {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .popup-topo-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #0369a1;
      text-decoration: none;
      background: #e0f2fe;
      padding: 5px 10px;

      white-space: nowrap;

    .sidebar-close-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px 8px;
      text-align: center;
    }

    .stat-val {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      color: #fbbf24;
    }

    .stat-lbl {
      font-size: 0.68rem;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Filters */
    .filters {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f8fafc;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .field select,
    .field input[type="text"] {
      width: 100%;
      padding: 6px 9px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.84rem;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .field select:focus,
    .field input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.15);
    }

    .filter-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      color: var(--text);
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background: #f1f5f9;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background: var(--danger-dark);
    }

    .btn-danger-outline {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: var(--danger-dark);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-danger-outline:hover {
      background: #fee2e2;
    }

    /* List */
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
    }

    .list-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 8px 4px 6px;
    }

    .boulder-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #fff;
      cursor: pointer;
    }

    .boulder-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    .boulder-card.unmapped {
      cursor: default;
      opacity: 0.85;
      background: #fafafa;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-title {
      font-weight: 700;
      font-size: 0.88rem;
      line-height: 1.25;
    }

    .card-sector {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge-gps {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-est {
      background: #fffbeb;
      color: #b45309;
      border: 1px dashed #d97706;
    }

    .badge-nogps {
      background: #e2e8f0;
      color: #475569;
    }

    .card-problems-preview {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .show-more-wrap {
      padding: 6px 0 12px;
      text-align: center;
    }

    .show-more-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .show-more-btn:hover {
      background: #f1f5f9;
    }

    /* Map Area */
    .map-wrapper {
      flex: 1;
      position: relative;
      height: 100%;
      width: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Positioned cleanly below + / - zoom controls with higher z-index */
    .leaflet-top.leaflet-left {
      top: 10px;
      left: 10px;
    }

    .sidebar-toggle {
      position: absolute;
      top: 90px;
      left: 10px;
      z-index: 1050;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-toggle:hover {
      background: #f8fafc;
    }

    /* Move Pin Mode Banner */
    .move-pin-banner {
      display: none;
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1060;
      background: #0f172a;
      color: #fff;
      border-radius: 10px;
      padding: 9px 14px;
      box-shadow: var(--shadow);
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      max-width: calc(100vw - 24px);
    }

    .move-pin-banner.active {
      display: flex;
    }

    /* Legend (no backdrop-filter for 60fps mobile) */
    .map-legend {
      position: absolute;
      bottom: 20px;
      right: 12px;
      z-index: 950;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.78rem;
      box-shadow: var(--shadow);
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .legend-boulder {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .legend-boulder-est {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f59e0b;
      border: 2px dashed #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .legend-parking {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: var(--parking);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    /* Custom Leaflet DivIcons */
    .marker-boulder {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      border: 2.5px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.38);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .marker-boulder.estimated {
      border: 2.5px dashed #ffffff;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      opacity: 0.92;
    }

    .marker-boulder.moving-pin {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      border: 3px solid #ffffff;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.35);
      cursor: grab;
    }

    .marker-parking {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.38);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Interactive Area & Sector Pill Labels */
    .map-pill-wrap {
      display: inline-flex;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }

    .area-pill-badge { display: none !important;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #0f172a;
      color: #ffffff;
      border: 2px solid #fbbf24;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.35);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .area-pill-badge:hover {
      background: #1e293b;
    }

    .area-pill-count {
      background: #fbbf24;
      color: #0f172a;
      border-radius: 999px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 800;
    }

    .sector-pill-badge { display: none !important;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      border: 1.5px solid #0f172a;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .sector-pill-badge:hover {
      background: #fef3c7;
      border-color: #d97706;
    }

    .sector-pill-count {
      background: #0f172a;
      color: #ffffff;
      border-radius: 999px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 700;
    }

    .est-label {
      color: #fbbf24;
      font-weight: 700;
    }

    /* Popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
    }

    .leaflet-popup-content {
      margin: 0;
      width: 330px !important;
      max-width: 86vw;
    }

    .popup-box {
      font-family: inherit;
    }

    .popup-header {
      padding: 11px 14px;
      background: #0f172a;
      color: #fff;
    }

    .popup-header.parking-hdr {
      background: #1e40af;
    }

    .popup-sector {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #fbbf24;
      font-weight: 700;
    }

    .popup-header.parking-hdr .popup-sector {
      color: #bfdbfe;
    }

    .popup-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 2px 0 4px;
    }

    .popup-coords {
      font-size: 0.73rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .popup-coords a {
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
    }

    .popup-coords a:hover {
      text-decoration: underline;
    }

    .popup-body {
      padding: 10px 14px 12px;
      max-height: 52vh;
      overflow-y: auto;
    }

    .problem-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .problem-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px 7px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.84rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .problem-item:last-child {
      border-bottom: none;
    }

    .problem-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .problem-item-desc {
      font-size: 0.75rem;
      color: #475569;
      line-height: 1.35;
      padding-left: 14px;
    }

    .problem-item.highlighted {
      background: #fffbeb;
      font-weight: 600;
    }

    .problem-item.is-line-active {
      background: #fef3c7;
      box-shadow: inset 3px 0 0 #d97706;
      font-weight: 700;
    }

    .grade-pill {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .g-easy { background: #dcfce7; color: #166534; }
    .g-mid  { background: #dbeafe; color: #1e40af; }
    .g-hard { background: #f3e8ff; color: #6b21a8; }
    .g-vhard{ background: #18181b; color: #ffffff; }
    .g-proj { background: #e2e8f0; color: #334155; }

    .popup-thumb-wrap {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .popup-thumb-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .popup-photo-stage-wrap {
      text-align: center;
    }

    .popup-photo-stage {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin: 8px auto;
      line-height: 0;
    }

    .popup-boulder-img {
      max-height: 55vh;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      border-radius: 6px;
      cursor: pointer;
    }

    .topo-svg-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .topo-svg-group {
      pointer-events: all;
      cursor: pointer;
      transition: opacity 0.14s ease;
    }

    .topo-svg-overlay.has-highlight .topo-svg-group:not(.is-highlighted) {
      opacity: 0.28;
    }

    .topo-svg-group .topo-hit-path {
      fill: none;
      stroke: transparent;
      stroke-width: 24;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .topo-svg-group .topo-outline-path {
      fill: none;
      stroke: rgba(255, 255, 255, 0.85);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .topo-svg-group .topo-visible-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .topo-svg-group.is-highlighted .topo-visible-path {
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.95));
    }

    .popup-photo-empty {
      margin-top: 6px;
      padding: 12px 10px;
      border: 1.5px dashed #cbd5e1;
      border-radius: 6px;
      text-align: center;
      font-size: 0.78rem;
      color: #64748b;
      background: #f8fafc;
    }

    .popup-photo-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .popup-photo-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .popup-photo-btn:hover {
      background: #e2e8f0;
    }

    .popup-photo-btn input[type="file"] {
      display: none;
    }

    .popup-reset-photo {
      background: none;
      border: none;
      padding: 2px 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #b91c1c;
      text-decoration: underline;
      cursor: pointer;
    }

    .popup-footer-actions {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3300;
      background: rgba(15, 23, 42, 0.9);
      align-items: center;
      justify-content: center;
      padding: 20px;
      flex-direction: column;
      gap: 12px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-stage {
      position: relative;
      display: inline-block;
      line-height: 0;
      max-width: 95vw;
      max-height: 85vh;
    }

    .lightbox-stage img {
      max-width: 95vw;
      max-height: 85vh;
      width: auto;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      background: #0f172a;
      display: block;
    }

    .lightbox-caption {
      color: #f8fafc;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      border-radius: 999px;
      width: 38px;
      height: 38px;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .popup-description {
      font-size: 0.8rem;
      color: #475569;
      background: #f8fafc;
      border-left: 3px solid #cbd5e1;
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .popup-topo-wrap {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .popup-topo-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #0369a1;
      text-decoration: none;
      background: #e0f2fe;
      padding: 5px 10px;
      border-radius: 6px;
    }

    .popup-topo-link:hover {
      background: #bae6fd;
    }

    /* Live Smartphone GPS Floating Panel (no backdrop-filter) */
    .gps-controls {
      position: absolute;
      bottom: 20px;
      left: 12px;
      z-index: 950;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 8px;
      box-shadow: var(--shadow);
      max-width: calc(100vw - 24px);
    }

    .gps-btn,
    .gps-copy-btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--text);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .gps-btn.active {
      background: #2563eb;
      border-color: #1d4ed8;
      color: #fff;
    }

    .gps-copy-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .gps-copy-btn.copied {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }

    .gps-readout {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.73rem;
      color: #334155;
      padding: 0 4px;
    }

    .gps-readout.error {
      font-family: inherit;
      color: #b91c1c;
      font-weight: 600;
    }

    /* Pulsing Blue GPS Marker */
    .gps-pulse-wrap {
      position: relative;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gps-pulse-ring {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.45);
      animation: gpsPulse 1.8s ease-out infinite;
    }

    .gps-pulse-core {
      position: relative;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #2563eb;
      border: 2.5px solid #ffffff;
      box-shadow: 0 1px 6px rgba(37, 99, 235, 0.7);
    }

    @keyframes gpsPulse {
      0% { transform: scale(0.8); opacity: 0.85; }
      70% { transform: scale(2.4); opacity: 0; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .kml-status {
      font-size: 0.74rem;
      color: #0369a1;
      font-weight: 600;
      display: none;
    }

    .kml-status.visible {
      display: block;
    }

    .btn-add-boulder {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #0f172a;
      background: #0f172a;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-add-boulder:hover {
      background: #1e293b;
    }

    .popup-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .popup-edit-btn {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .popup-edit-btn:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .popup-comments {
      font-size: 0.8rem;
      color: #334155;
      background: #fffbeb;
      border-left: 3px solid var(--accent);
      padding: 6px 8px;
      border-radius: 4px;
      margin: 6px 0 8px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .popup-comments-lbl {
      font-weight: 700;
      color: #92400e;
    }

    .popup-edit-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pe-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .pe-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .pe-input,
    .pe-textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.82rem;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    .pe-input:focus,
    .pe-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.15);
    }

    .pe-textarea {
      resize: vertical;
      min-height: 50px;
    }

    .pe-prob-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .pe-prob-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pe-prob-row {
      display: grid;
      grid-template-columns: 1fr 76px 26px;
      gap: 5px;
      align-items: center;
    }

    .pe-del-prob {
      width: 26px;
      height: 28px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .pe-del-prob:hover {
      background: #fee2e2;
    }

    .pe-add-prob {
      align-self: flex-start;
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      color: #334155;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    .pe-add-prob:hover {
      background: #f1f5f9;
    }

    .pe-error {
      display: none;
      font-size: 0.76rem;
      font-weight: 600;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 5px 8px;
    }

    .pe-error.visible {
      display: block;
    }

    .pe-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .pe-loc-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }

    /* Modals (Add New Boulder & Area/Sector Stats) */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3100;
      background: rgba(15, 23, 42, 0.72);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #fff;
      border-radius: 12px;
      width: 92vw;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border);
    }

    .modal-header {
      padding: 12px 16px;
      background: #0f172a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 11px 11px 0 0;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 700;
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: none;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .modal-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-coords-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .modal-coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .modal-gps-btn {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .modal-gps-btn:hover {
      background: #dbeafe;
    }

    .modal-move-btn {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      color: #92400e;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .modal-move-btn:hover {
      background: #fef3c7;
    }

    .sidebar-extra-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn-backup-html {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-backup-html:hover {
      background: #f1f5f9;
    }

    .popup-draw-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fffbeb;
      border: 1px solid #f59e0b;
      color: #92400e;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .popup-draw-btn:hover {
      background: #fef3c7;
    }

    .popup-photo-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Grade Chart Modal */
    .stats-summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stats-summary-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }

    .stats-summary-num {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      display: block;
    }

    .stats-summary-lbl {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
    }

    .chart-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .chart-row {
      display: grid;
      grid-template-columns: 98px 1fr 44px;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    .chart-lbl {
      font-weight: 700;
      color: #1e293b;
      white-space: nowrap;
    }

    .chart-track {
      height: 16px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
    }

    .chart-fill {
      height: 100%;
      border-radius: 999px;
      min-width: 0;
    }

    .chart-val {
      text-align: right;
      font-weight: 800;
      color: #0f172a;
    }

    /* Touch-Friendly SVG Climb Line Drawing Modal */
    .draw-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3200;
      background: rgba(15, 23, 42, 0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .draw-modal-backdrop.open {
      display: flex;
    }

    .draw-modal-card {
      background: #ffffff;
      border-radius: 12px;
      width: 96vw;
      max-width: 760px;
      max-height: 95vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .draw-modal-header {
      padding: 10px 14px;
      background: #0f172a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .draw-modal-header h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .draw-problem-bar {
      padding: 8px 12px;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .draw-problem-bar select {
      flex: 1;
      min-width: 180px;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      background: #fff;
      color: #0f172a;
    }

    .draw-mode-toggle {
      display: inline-flex;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      overflow: hidden;
      background: #fff;
    }

    .draw-mode-btn {
      border: none;
      background: transparent;
      padding: 6px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }

    .draw-mode-btn.active {
      background: #0f172a;
      color: #fff;
    }

    .draw-stage-wrap {
      flex: 1;
      min-height: 200px;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 8px;
    }

    .draw-stage {
      position: relative;
      display: inline-block;
      line-height: 0;
      max-width: 100%;
    }

    #drawBgImg {
      display: block;
      max-width: 100%;
      max-height: 50vh;
      width: auto;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    #drawSvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
      overflow: visible;
    }

    .draw-toolbar {
      padding: 9px 12px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .draw-tools-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .draw-swatches {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .draw-swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #94a3b8;
      cursor: pointer;
      padding: 0;
    }

    .draw-swatch.active {
      transform: scale(1.15);
      border-color: #0f172a;
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0f172a;
    }

    .draw-stamps-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.76rem;
    }

    .draw-stamp-btn {
      padding: 4px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #0f172a;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    .draw-stamp-btn.active {
      background: #d97706;
      border-color: #b45309;
      color: #fff;
    }

    .draw-size-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      color: #334155;
    }

    .draw-size-wrap input[type="range"] {
      width: 90px;
      accent-color: var(--accent);
    }

    .draw-actions-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .nb-photo-preview {
      max-height: 120px;
      width: auto;
      max-width: 100%;
      border-radius: 6px;
      margin-top: 6px;
      display: none;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 315px;
      }
      .gps-controls {
        bottom: 58px;
        left: 10px;
      }
      .map-legend {
        bottom: 10px;
        right: 10px;
        left: 10px;
        justify-content: center;
        gap: 10px;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-header-top">
          <div>
            <h1>Sintra Bouldering Map</h1>
            <p>Malveira, Cabo da Roca &amp; Coast</p>
          </div>
          <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button" title="Close guidebook panel">&#10005; Close</button>
        </div>
        <div class="stats-bar">
          <div class="stat-box">
            <span class="stat-val" id="statMapped">0</span>
            <span class="stat-lbl">Mapped</span>
          </div>
          <div class="stat-box">
            <span class="stat-val" id="statProblems">0</span>
            <span class="stat-lbl">Problems</span>
          </div>
          <div class="stat-box">
            <span class="stat-val" id="statParking">0</span>
            <span class="stat-lbl">Parking</span>
          </div>
        </div>
      </div>

      <div class="filters">
        <div class="filter-row">
          <div class="field">
            <label for="areaFilter">Area</label>
            <select id="areaFilter">
              <option value="ALL">All Areas</option>
            </select>
          </div>
          <div class="field">
            <label for="sectorFilter">Sector</label>
            <select id="sectorFilter">
              <option value="ALL">All Sectors</option>
            </select>
          </div>
        </div>

        <div class="filter-row">
          <div class="field">
            <label for="gradeFilter">Grade</label>
            <select id="gradeFilter">
              <option value="ALL">All Grades</option>
              <optgroup label="Grade Brackets">
                <option value="BRACKET_EASY">Easy (III – 5C+)</option>
                <option value="BRACKET_6">6th Grade (6A – 6C+)</option>
                <option value="BRACKET_7">7th Grade (7A – 7C+)</option>
                <option value="BRACKET_8">8th Grade (8A+)</option>
              </optgroup>
              <optgroup label="Exact Grade" id="exactGradeGroup"></optgroup>
            </select>
          </div>
          <div class="field">
            <label for="searchFilter">Search</label>
            <input type="text" id="searchFilter" placeholder="Obélix, 7A, beta..." />
          </div>
        </div>

        <div class="filter-actions">
          <label class="checkbox-label">
            <input type="checkbox" id="showParking" checked />
            Show Parking
          </label>
          <div class="btn-group">
            <button class="btn" id="importKmlBtn" title="Load Coast.kml or any KML file">Import KML</button>
            <input type="file" id="kmlFileInput" accept=".kml,.xml" style="display:none" />
            <button class="btn" id="fitBtn" title="Zoom to visible markers">Fit Map</button>
            <button class="btn btn-primary" id="resetBtn">Reset</button>
          </div>
        </div>
        <div class="sidebar-extra-actions">
          <button class="btn-add-boulder" id="addBoulderBtn" type="button">+ Add New Boulder</button>
          <button class="btn-backup-html" id="downloadBackupBtn" type="button" title="Save all edits, new boulders, photos &amp; vector lines into a self-contained HTML">Download Backup HTML</button>
        </div>
        <div class="kml-status" id="kmlStatus"></div>
      </div>

      <div class="list-container" id="boulderList"></div>
    </aside>

    <!-- Map -->
    <main class="map-wrapper">
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle guidebook &amp; filters">
        &#9776; Guidebook / Filters
      </button>

      <div class="move-pin-banner" id="movePinBanner">
        <span id="movePinText">Drag marker or tap map to move pin</span>
        <button type="button" class="btn" id="cancelMovePinBtn">Cancel</button>
      </div>

      <div id="map"></div>

      <!-- Floating Live Smartphone GPS Controls -->
      <div class="gps-controls" id="gpsControls">
        <button class="gps-btn" id="locateBtn" type="button" title="Track live smartphone GPS location">
          &#128205; Locate Me
        </button>
        <button class="gps-copy-btn" id="copyGpsBtn" type="button" disabled title="Copy current GPS coordinates to clipboard">
          &#128203; Copy GPS
        </button>
        <span class="gps-readout" id="gpsReadout"></span>
      </div>

      <div class="map-legend">
        <div class="legend-item">
          <span class="legend-boulder"></span> Exact
        </div>
        <div class="legend-item">
          <span class="legend-boulder-est"></span> Estimated
        </div>
        <div class="legend-item">
          <span class="legend-parking">P</span> Parking
        </div>
      </div>
    </main>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <div class="lightbox-stage" id="lightboxStage">
      <img id="lightboxImg" alt="Boulder photo" referrerpolicy="no-referrer" />
      <svg class="topo-svg-overlay" id="lightboxSvg" style="display:none;"></svg>
    </div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <!-- Area / Sector Stats & Grade Chart Modal -->
  <div class="modal-backdrop" id="statsModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-labelledby="statsModalTitle">
      <div class="modal-header">
        <h2 id="statsModalTitle">Sector Stats</h2>
        <button class="modal-close" id="statsCloseBtn" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="statsModalBody"></div>
    </div>
  </div>

  <!-- Add New Boulder Modal -->
  <div class="modal-backdrop" id="addBoulderModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-labelledby="addBoulderTitle">
      <div class="modal-header">
        <h2 id="addBoulderTitle">+ Add New Boulder</h2>
        <button class="modal-close" id="nbCloseBtn" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-coords-grid">
          <div class="pe-field">
            <label class="pe-label" for="nbArea">Area</label>
            <input class="pe-input" id="nbArea" type="text" list="areaSuggestions" placeholder="Malveira / Cabo da Roca / Coast" />
          </div>
          <div class="pe-field">
            <label class="pe-label" for="nbSector">Sector</label>
            <input class="pe-input" id="nbSector" type="text" list="sectorSuggestions" placeholder="e.g. Obélix" />
          </div>
        </div>
        <div class="pe-field">
          <label class="pe-label" for="nbName">Boulder Name</label>
          <input class="pe-input" id="nbName" type="text" placeholder="e.g. Hidden Roof" />
        </div>
        <div class="pe-field">
          <div class="modal-coords-header">
            <label class="pe-label">Coordinates (Lat, Lon)</label>
            <button class="modal-gps-btn" id="nbUseGpsBtn" type="button">&#128205; Use Current GPS</button>
          </div>
          <div class="modal-coords-grid">
            <input class="pe-input" id="nbLat" type="number" step="0.000001" placeholder="Latitude (38.75...)" />
            <input class="pe-input" id="nbLon" type="number" step="0.000001" placeholder="Longitude (-9.43...)" />
          </div>
        </div>
        <div class="pe-field">
          <label class="pe-label">Photo (Optional)</label>
          <label class="popup-photo-btn" style="align-self:flex-start;">
            &#128247; Add / Replace Photo
            <input type="file" accept="image/*" id="nbPhotoInput" />
          </label>
          <img id="nbPhotoPreview" class="nb-photo-preview" alt="Selected boulder photo" />
        </div>
        <div class="pe-field">
          <label class="pe-label">Problems, Grades &amp; Descriptions</label>
          <div class="pe-prob-list" id="nbProblemsContainer"></div>
          <button class="pe-add-prob" id="nbAddProbBtn" type="button">+ Add Problem</button>
        </div>
        <div class="pe-field">
          <label class="pe-label" for="nbComments">Comments / Beta Notes</label>
          <textarea class="pe-textarea" id="nbComments" placeholder="Approach info, landing, rock quality, beta..."></textarea>
        </div>
        <div class="pe-error" id="nbError"></div>
