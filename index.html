        }
        if (!navigator.geolocation) return alert("Geolocation not supported");
        nbUseGpsBtn.textContent = "Locating...";
        navigator.geolocation.getCurrentPosition(
          pos => {
            nbUseGpsBtn.innerHTML = "&#128205; Use Current GPS";
            lastGpsPos = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
            nbLatEl.value = pos.coords.latitude.toFixed(6);
            nbLonEl.value = pos.coords.longitude.toFixed(6);
          },
          err => {
            nbUseGpsBtn.innerHTML = "&#128205; Use Current GPS";
            alert("GPS error: " + (err ? err.message : "Permission denied"));
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      });

      nbSaveBtn.addEventListener("click", async () => {
        const area = (nbAreaEl.value || "").trim() || "Malveira";
        const sector = (nbSectorEl.value || "").trim();
        const name = (nbNameEl.value || "").trim();
        const lat = parseFloat(nbLatEl.value);
        const lon = parseFloat(nbLonEl.value);
        const comments = (nbCommentsEl.value || "").trim();

        if (!sector || !name) {
          nbErrorEl.textContent = "Sector and Boulder Name are required.";
          nbErrorEl.classList.add("visible");
          return;
        }
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
          nbErrorEl.textContent = "Valid coordinates are required.";
          nbErrorEl.classList.add("visible");
          return;
        }

        const problems = [];
        nbProblemsContainer.querySelectorAll(".pe-prob-card").forEach(c => {
          const pName = (c.querySelector(".pe-prob-name").value || "").trim();
          const pGrade = normalizeGrade(c.querySelector(".pe-prob-grade").value);
          const pDesc = (c.querySelector(".pe-prob-desc").value || "").trim();
          if (pName || pGrade) {
            problems.push({ name: pName || "?", grade: pGrade, desc: pDesc });
            if (pGrade && pGrade !== "?") gradesSet.add(pGrade);
          }
        });

        const baseKey = `custom_${Date.now()}_${++customIdCounter}`;
        const newRecord = {
          baseKey,
          area,
          sector,
          name,
          lat,
          lon,
          comments,
          problems
        };

        savedStore.created.push(newRecord);
        persistSavedStore();

        if (pendingNbPhotoDataUrl) {
          await saveBoulderPhoto(`${sector}||${name}`, pendingNbPhotoDataUrl);
        }

        areasSet.add(area);
        sectorsSet.add(sector);

        boulderMap.set(baseKey, {
          type: "boulder",
          baseKey,
          area,
          sector,
          name,
          lat,
          lon,
          estimated: false,
          isCustom: true,
          comments,
          imageUrls: new Set(),
          problems
        });

        closeAddBoulderModal();
        refreshCollections();
        populateDropdowns();
        render();

        const m = currentMarkerByKey.get(baseKey);
        if (m) {
          map.setView(m.getLatLng(), Math.max(map.getZoom(), 17), { animate: true });
          m.openPopup();
        }
      });

      // Interactive SVG Vector Climb Line Drawing Modal Logic
      const drawLineModal = document.getElementById("drawLineModal");
      const drawModalTitle = document.getElementById("drawModalTitle");
      const drawProblemSelect = document.getElementById("drawProblemSelect");
      const drawModeFreehandBtn = document.getElementById("drawModeFreehand");
      const drawModeWaypointsBtn = document.getElementById("drawModeWaypoints");
      const drawFinishWpBtn = document.getElementById("drawFinishWpBtn");
      const drawCloseBtn = document.getElementById("drawCloseBtn");
      const drawCancelBtn = document.getElementById("drawCancelBtn");
      const drawBgImg = document.getElementById("drawBgImg");
      const drawSvg = document.getElementById("drawSvg");
      const drawSwatches = document.getElementById("drawSwatches");
      const drawBrushSizeEl = document.getElementById("drawBrushSize");
      const drawBrushValEl = document.getElementById("drawBrushVal");
      const drawUndoBtn = document.getElementById("drawUndoBtn");
      const drawClearProblemBtn = document.getElementById("drawClearProblemBtn");
      const drawClearBtn = document.getElementById("drawClearBtn");
      const drawSaveBtn = document.getElementById("drawSaveBtn");
      const drawErrorEl = document.getElementById("drawError");

      let drawActiveBoulder = null;
      let drawActivePopup = null;
      let drawColor = "#3b82f6";
      let drawWidth = 5;
      let isWaypointsMode = false;
      let activeStampText = null;

      // Existing topo lines for this boulder: array of { probIdx, color, width, d, badge, stamps }
      let localTopos = [];
      let activeFreehandPts = [];
      let activeWaypointPts = [];
      let isFreehandDrawing = false;

      function renderDrawSvg() {
        drawSvg.setAttribute("viewBox", "0 0 1000 1000");
        let markup = renderVectorTopoMarkup(localTopos, parseInt(drawProblemSelect.value, 10));

        // Active in-progress stroke
        if (isFreehandDrawing && activeFreehandPts.length > 0) {
          const d = pointsToSmoothPathD(activeFreehandPts);
          markup += `<path d="${d}" fill="none" stroke="${drawColor}" stroke-width="${drawWidth * 2}" stroke-linecap="round" stroke-linejoin="round" />`;
        }

        // Active in-progress waypoints
        if (isWaypointsMode && activeWaypointPts.length > 0) {
          const d = pointsToSmoothPathD(activeWaypointPts);
          markup += `<path d="${d}" fill="none" stroke="${drawColor}" stroke-width="${drawWidth * 2}" stroke-dasharray="6,6" stroke-linecap="round" />`;
          activeWaypointPts.forEach(pt => {
            markup += `<circle cx="${pt.x}" cy="${pt.y}" r="8" fill="#ffffff" stroke="${drawColor}" stroke-width="3" />`;
          });
        }

        drawSvg.innerHTML = markup;
      }

      function openDrawLineModal(boulder, popup, imgSrc) {
        drawActiveBoulder = boulder;
        drawActivePopup = popup;
        const bKey = `${boulder.sector}||${boulder.name}`;
        localTopos = JSON.parse(JSON.stringify(customToposMap.get(bKey) || []));
        activeFreehandPts = [];
        activeWaypointPts = [];
        isFreehandDrawing = false;
        activeStampText = null;
        drawErrorEl.classList.remove("visible");

        drawModalTitle.textContent = `Draw Line — ${boulder.name}`;
        drawProblemSelect.innerHTML = boulder.problems
          .map((p, idx) => `<option value="${idx}">${idx + 1}. ${escapeHtml(p.name)} (${escapeHtml(p.grade || "-")})</option>`)
          .join("");

        function updateColorForProblem() {
          const idx = parseInt(drawProblemSelect.value, 10);
          const p = boulder.problems[idx];
          if (p) {
            drawColor = gradeColor(p.grade);
            drawSwatches.querySelectorAll(".draw-swatch").forEach(s => {
              s.classList.toggle("active", s.dataset.color.toLowerCase() === drawColor.toLowerCase());
            });
          }
          renderDrawSvg();
        }

        drawProblemSelect.onchange = updateColorForProblem;
        updateColorForProblem();

        drawBgImg.src = imgSrc;
        drawLineModal.classList.add("open");
        setTimeout(renderDrawSvg, 60);
      }

      function closeDrawLineModal() {
        drawLineModal.classList.remove("open");
        drawBgImg.removeAttribute("src");
        localTopos = [];
      }

      drawCloseBtn.addEventListener("click", closeDrawLineModal);
      drawCancelBtn.addEventListener("click", closeDrawLineModal);

      // Mode Toggles
      drawModeFreehandBtn.addEventListener("click", () => {
        isWaypointsMode = false;
        drawModeFreehandBtn.classList.add("active");
        drawModeWaypointsBtn.classList.remove("active");
        drawFinishWpBtn.style.display = "none";
        if (activeWaypointPts.length >= 2) finishWaypointsLine();
      });

      drawModeWaypointsBtn.addEventListener("click", () => {
        isWaypointsMode = true;
        drawModeWaypointsBtn.classList.add("active");
        drawModeFreehandBtn.classList.remove("active");
        drawFinishWpBtn.style.display = "inline-block";
      });

      // Swatches & Size
      drawSwatches.querySelectorAll(".draw-swatch").forEach(b => {
        b.addEventListener("click", () => {
          drawSwatches.querySelectorAll(".draw-swatch").forEach(s => s.classList.remove("active"));
          b.classList.add("active");
          drawColor = b.dataset.color;
        });
      });

      drawBrushSizeEl.addEventListener("input", () => {
        drawWidth = parseInt(drawBrushSizeEl.value, 10) || 5;
        drawBrushValEl.textContent = String(drawWidth);
      });

      // Stamp Tools
      document.querySelectorAll(".draw-stamp-btn[data-stamp]").forEach(b => {
        b.addEventListener("click", () => {
          activeStampText = b.dataset.stamp;
          document.querySelectorAll(".draw-stamp-btn").forEach(s => s.classList.remove("active"));
          b.classList.add("active");
        });
      });

      document.getElementById("drawCustomStampBtn").addEventListener("click", () => {
        const text = (document.getElementById("drawCustomStampInput").value || "").trim().toUpperCase();
        if (text) {
          activeStampText = text;
          document.querySelectorAll(".draw-stamp-btn").forEach(s => s.classList.remove("active"));
          document.getElementById("drawCustomStampBtn").classList.add("active");
        }
      });

      function getSvgPoint(ev) {
        const rect = drawBgImg.getBoundingClientRect();
        const clientX = ev.touches && ev.touches.item(0) ? ev.touches.item(0).clientX : ev.clientX;
        const clientY = ev.touches && ev.touches.item(0) ? ev.touches.item(0).clientY : ev.clientY;
        const x = Math.round(Math.max(0, Math.min(1000, ((clientX - rect.left) / Math.max(1, rect.width)) * 1000)));
        const y = Math.round(Math.max(0, Math.min(1000, ((clientY - rect.top) / Math.max(1, rect.height)) * 1000)));
        return { x, y };
      }

      function finishWaypointsLine() {
        if (activeWaypointPts.length < 2) {
          activeWaypointPts = [];
          renderDrawSvg();
          return;
        }
        const probIdx = parseInt(drawProblemSelect.value, 10);
        localTopos = localTopos.filter(t => t.probIdx !== probIdx);
        const d = pointsToSmoothPathD(activeWaypointPts);
        localTopos.push({
          probIdx,
          color: drawColor,
          width: drawWidth,
          d,
          badge: {
            x: activeWaypointPts[0].x,
            y: activeWaypointPts[0].y,
            text: String(probIdx + 1)
          },
          stamps: []
        });
        activeWaypointPts = [];
        renderDrawSvg();
      }

      drawFinishWpBtn.addEventListener("click", finishWaypointsLine);

      drawSvg.addEventListener("pointerdown", ev => {
        ev.preventDefault();
        const pt = getSvgPoint(ev);

        // Place stamp if active
        if (activeStampText) {
          const probIdx = parseInt(drawProblemSelect.value, 10);
          let target = localTopos.find(t => t.probIdx === probIdx);
          if (!target) {
            target = { probIdx, color: drawColor, width: drawWidth, d: "", badge: null, stamps: [] };
            localTopos.push(target);
          }
          if (!Array.isArray(target.stamps)) target.stamps = [];
          target.stamps.push({ x: pt.x, y: pt.y, text: activeStampText });
          activeStampText = null;
          document.querySelectorAll(".draw-stamp-btn").forEach(s => s.classList.remove("active"));
          renderDrawSvg();
          return;
        }

        if (isWaypointsMode) {
          activeWaypointPts.push(pt);
          renderDrawSvg();
          return;
        }

        // Freehand
        isFreehandDrawing = true;
        activeFreehandPts = [pt];
        renderDrawSvg();
      });

      drawSvg.addEventListener("pointermove", ev => {
        if (!isFreehandDrawing) return;
        ev.preventDefault();
        activeFreehandPts.push(getSvgPoint(ev));
        renderDrawSvg();
      });

      function finishFreehand() {
        if (!isFreehandDrawing) return;
        isFreehandDrawing = false;
        if (activeFreehandPts.length >= 2) {
          const probIdx = parseInt(drawProblemSelect.value, 10);
          localTopos = localTopos.filter(t => t.probIdx !== probIdx);
          const d = pointsToSmoothPathD(activeFreehandPts);
          localTopos.push({
            probIdx,
            color: drawColor,
            width: drawWidth,
            d,
            badge: {
              x: activeFreehandPts[0].x,
              y: activeFreehandPts[0].y,
              text: String(probIdx + 1)
            },
            stamps: []
          });
        }
        activeFreehandPts = [];
        renderDrawSvg();
      }

      drawSvg.addEventListener("pointerup", finishFreehand);
      drawSvg.addEventListener("pointercancel", finishFreehand);

      drawUndoBtn.addEventListener("click", () => {
        if (isWaypointsMode && activeWaypointPts.length > 0) {
          activeWaypointPts.pop();
          renderDrawSvg();
          return;
        }
        if (localTopos.length > 0) {
          localTopos.pop();
          renderDrawSvg();
        }
      });

      drawClearProblemBtn.addEventListener("click", () => {
        const probIdx = parseInt(drawProblemSelect.value, 10);
        localTopos = localTopos.filter(t => t.probIdx !== probIdx);
        activeWaypointPts = [];
        activeFreehandPts = [];
        renderDrawSvg();
      });

      drawClearBtn.addEventListener("click", () => {
        localTopos = [];
        activeWaypointPts = [];
        activeFreehandPts = [];
        renderDrawSvg();
      });

      drawSaveBtn.addEventListener("click", async () => {
        if (!drawActiveBoulder) return;
        const bKey = `${drawActiveBoulder.sector}||${drawActiveBoulder.name}`;
        await saveBoulderTopos(bKey, localTopos);

        if (drawActivePopup) {
          drawActivePopup.setContent(buildBoulderPopup(drawActiveBoulder, gradeFilterEl.value, searchFilterEl.value.trim().toLowerCase()));
          drawActivePopup.update();
          wirePopupControls(drawActivePopup, drawActiveBoulder);
        }
        closeDrawLineModal();
      });

      // Live Smartphone GPS
      const locateBtn = document.getElementById("locateBtn");
      const copyGpsBtn = document.getElementById("copyGpsBtn");
      const gpsReadout = document.getElementById("gpsReadout");
      const gpsLayerGroup = L.layerGroup().addTo(map);
      let gpsMarker = null;
      let gpsAccuracyCircle = null;
      let isLocating = false;
      let lastGpsPos = null;

      const gpsIcon = L.divIcon({
        className: "",
        html: '<div class="gps-pulse-wrap"><div class="gps-pulse-ring"></div><div class="gps-pulse-core"></div></div>',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      locateBtn.addEventListener("click", () => {
        if (!isLocating) {
          isLocating = true;
          locateBtn.classList.add("active");
          locateBtn.innerHTML = "&#128205; Locating...";
          gpsReadout.classList.remove("error");
          gpsReadout.textContent = "Waiting for GPS...";
          map.locate({ setView: true, watch: true, enableHighAccuracy: true });
        } else {
          isLocating = false;
          map.stopLocate();
          locateBtn.classList.remove("active");
          locateBtn.innerHTML = "&#128205; Locate Me";
        }
      });

      map.on("locationfound", e => {
        lastGpsPos = { lat: e.latlng.lat, lng: e.latlng.lng, accuracy: e.accuracy };
        const radius = e.accuracy || 0;

        if (!gpsAccuracyCircle) {
          gpsAccuracyCircle = L.circle(e.latlng, {
            radius,
            color: "#2563eb",
            weight: 1.5,
            fillColor: "#3b82f6",
            fillOpacity: 0.14,
            interactive: false
          }).addTo(gpsLayerGroup);
        } else {
          gpsAccuracyCircle.setLatLng(e.latlng).setRadius(radius);
        }

        if (!gpsMarker) {
          gpsMarker = L.marker(e.latlng, { icon: gpsIcon, zIndexOffset: 1000 })
            .bindPopup("")
            .addTo(gpsLayerGroup);
        } else {
          gpsMarker.setLatLng(e.latlng);
        }

        const coordsStr = `${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
        gpsMarker.setPopupContent(
          `<div style="padding:10px 12px;font-size:0.84rem;"><strong>Your Live GPS</strong><br>${coordsStr}<br><span style="color:#64748b;">Accuracy: &plusmn;${Math.round(radius)} m</span></div>`
        );

        locateBtn.innerHTML = "&#128205; GPS Live";
        gpsReadout.classList.remove("error");
        gpsReadout.textContent = `${coordsStr} (±${Math.round(radius)}m)`;
        copyGpsBtn.disabled = false;
      });

      map.on("locationerror", e => {
        isLocating = false;
        map.stopLocate();
        locateBtn.classList.remove("active");
        locateBtn.innerHTML = "&#128205; Locate Me";
        gpsReadout.classList.add("error");
        gpsReadout.textContent = `GPS error: ${e.message || "Permission denied"}`;
      });

      copyGpsBtn.addEventListener("click", async () => {
        if (!lastGpsPos) return;
        const text = `${lastGpsPos.lat.toFixed(6)}, ${lastGpsPos.lng.toFixed(6)}`;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement("textarea");
            ta.value = text;

      map.on("moveend zoomend", () => { if (map.hasLayer(boulderLayerGroup) && !document.querySelector(".leaflet-popup")) render(false); });
      // --- Zoom-Aware Area & Sector Boundary Zones ---
      const sectorZoneLayer = L.layerGroup().addTo(map);
      const zoneColors = ["#d97706", "#2563eb", "#059669", "#7c3aed", "#db2777", "#0891b2", "#ea580c", "#4f46e5", "#16a34a"];

      function computePaddedHull(points, padDeg = 0.00028) {
        const pts = [];
        points.forEach(pt => {
          const lat = pt.lat, lon = pt.lon;
          for (let i = 0; i < 12; i++) {
            const a = (i * Math.PI) / 6;
            pts.push({ lat: lat + Math.sin(a) * padDeg, lon: lon + Math.cos(a) * padDeg * 1.28 });
          }
        });
        pts.sort((a, b) => a.lon === b.lon ? a.lat - b.lat : a.lon - b.lon);
        const cross = (o, a, b) => (a.lon - o.lon) * (b.lat - o.lat) - (a.lat - o.lat) * (b.lon - o.lon);
        const lower = [];
        for (const p of pts) {
          while (lower.length >= 2 && cross(lower.at(-2), lower.at(-1), p) <= 0) lower.pop();
          lower.push(p);
        }
        const upper = [];
        for (let i = pts.length - 1; i >= 0; i--) {
          const p = pts.at(i);
          while (upper.length >= 2 && cross(upper.at(-2), upper.at(-1), p) <= 0) upper.pop();
          upper.push(p);
        }
        upper.pop(); lower.pop();
        return lower.concat(upper).map(p => L.latLng(p.lat, p.lon));
      }

      function buildGradeChartPopup(areaName, sectorName, initialAreaScope) {
        const wrap = document.createElement("div");
        wrap.style.cssText = "min-width:240px;max-width:275px;font-family:system-ui,sans-serif;";
        let isAreaScope = initialAreaScope;

        const drawChart = () => {
          const bLow = { label: "≤4", color: "#22c55e", items: [] };
          const b5   = { label: "5", color: "#10b981", items: [] };
          const b6   = { label: "6A-6C+", color: "#3b82f6", items: [] };
          const b7   = { label: "7A-7C+", color: "#f59e0b", items: [] };
          const b8   = { label: "8A+", color: "#ef4444", items: [] };
          const bPrj = { label: "Proj/?", color: "#94a3b8", items: [] };
          const buckets = [bLow, b5, b6, b7, b8, bPrj];

          let boulderCount = 0;
          boulders.forEach(b => {
            if (b.area !== areaName) return;
            if (!isAreaScope && sectorName && b.sector !== sectorName) return;
            boulderCount++;
            b.problems.forEach(p => {
              const gr = (p.grade || "").trim().toUpperCase();
              const entry = { bKey: b.baseKey, bName: b.name, sector: b.sector, pName: p.name, grade: p.grade || "?" };
              if (/^[1-4]/.test(gr)) bLow.items.push(entry);
              else if (/^5/.test(gr)) b5.items.push(entry);
              else if (/^6/.test(gr)) b6.items.push(entry);
              else if (/^7/.test(gr)) b7.items.push(entry);
              else if (/^8/.test(gr)) b8.items.push(entry);
              else bPrj.items.push(entry);
            });
          });

          const visibleBuckets = buckets.filter(x => x.items.length > 0 || x.label !== "Proj/?");
          const maxC = Math.max(1, ...visibleBuckets.map(x => x.items.length));
          const totalP = buckets.reduce((s, x) => s + x.items.length, 0);

          wrap.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:2px;">
              <strong style="font-size:14px;color:#0f172a;">${escapeHtml(isAreaScope ? areaName + " Area" : sectorName)}</strong>
              ${sectorName ? `<button type="button" class="scope-toggle-btn" style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid #cbd5e1;background:#f8fafc;color:#334155;cursor:pointer;">${isAreaScope ? "Show Sector" : "Whole Area"}</button>` : ""}
            </div>
            <div style="font-size:11px;color:#64748b;margin-bottom:8px;">${boulderCount} boulders &bull; ${totalP} problems &bull; hover/tap bar</div>
            <div style="display:flex;gap:5px;align-items:flex-end;padding-top:4px;border-top:1px solid #e2e8f0;">
              ${visibleBuckets.map((x, idx) => {
                const h = Math.round((x.items.length / maxC) * 44);
                return `<div data-bidx="${idx}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:2px;border-radius:4px;">
                  <span style="font-size:10px;font-weight:700;color:#0f172a;">${x.items.length}</span>
                  <div style="width:100%;height:46px;background:#f1f5f9;border-radius:4px;display:flex;align-items:flex-end;overflow:hidden;">
                    <div style="width:100%;height:${h}px;background:${x.color};border-radius:3px 3px 0 0;"></div>
                  </div>
                  <span style="font-size:9px;font-weight:600;color:#475569;white-space:nowrap;">${x.label}</span>
                </div>`;
              }).join("")}
            </div>
            <div class="grade-drill-list" style="margin-top:8px;max-height:145px;overflow-y:auto;border-top:1px solid #e2e8f0;padding-top:6px;display:none;"></div>
          `;

          const toggleBtn = wrap.querySelector(".scope-toggle-btn");
          if (toggleBtn) toggleBtn.onclick = (ev) => { ev.stopPropagation(); isAreaScope = !isAreaScope; drawChart(); };

          const listEl = wrap.querySelector(".grade-drill-list");
          const showBucket = (idx) => {
            const bk = visibleBuckets[idx];
            if (!bk) return;
            wrap.querySelectorAll("[data-bidx]").forEach(el => el.style.background = el.dataset.bidx == idx ? "#e2e8f0" : "transparent");
            listEl.style.display = "block";
            if (bk.items.length === 0) { listEl.innerHTML = `<div style="font-size:11px;color:#94a3b8;">No ${bk.label} problems</div>`; return; }
            listEl.innerHTML = `<div style="font-size:10px;font-weight:700;color:#475569;margin-bottom:4px;">${bk.label} (${bk.items.length}) — tap to jump:</div>` +
              bk.items.map(it => `<div data-jump="${escapeHtml(it.bKey)}" style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 6px;margin-bottom:3px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:5px;cursor:pointer;font-size:11px;"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><strong style="color:#0f172a;">${escapeHtml(it.pName || it.bName)}</strong> <span style="color:#64748b;">(${escapeHtml(it.bName)}${isAreaScope ? " · " + escapeHtml(it.sector) : ""})</span></div><span style="font-weight:700;color:#d97706;flex-shrink:0;">${escapeHtml(it.grade)}</span></div>`).join("");
            listEl.querySelectorAll("[data-jump]").forEach(row => {
              row.onclick = () => {
                const targetB = boulders.find(x => x.baseKey === row.dataset.jump);
                if (!targetB || targetB.lat === null) return;
                map.closePopup(); map.setView([targetB.displayLat, targetB.displayLon], 18);
                setTimeout(() => { render(false); const m = activeMarkers.find(mk => mk._boulderRef && mk._boulderRef.baseKey === targetB.baseKey); if (m) m.openPopup(); }, 120);
              };
            });
          };
          wrap.querySelectorAll("[data-bidx]").forEach(col => { col.onmouseenter = () => showBucket(col.dataset.bidx); col.onclick = () => showBucket(col.dataset.bidx); });
        };

      function renderSectorZones() {
        sectorZoneLayer.clearLayers();
        const toggle = document.getElementById("showZonesToggle");
        if (toggle && !toggle.checked) return;
        const areaVal = areaSelect.value, sectorVal = sectorSelect.value, zoom = map.getZoom();
        const areaGroups = new Map(), sectorGroups = new Map();

        boulders.forEach(b => {
          if (b.lat === null || b.lon === null) return;
          if (areaVal !== "ALL" && b.area !== areaVal) return;
          if (sectorVal !== "ALL" && b.sector !== sectorVal) return;
          if (!areaGroups.has(b.area)) areaGroups.set(b.area, { area: b.area, pts: [], maxLat: -90, latSum: 0, lonSum: 0 });
          const ag = areaGroups.get(b.area);
          ag.pts.push({ lat: b.displayLat, lon: b.displayLon });
          if (b.displayLat > ag.maxLat) ag.maxLat = b.displayLat;
          ag.latSum += b.displayLat;
          ag.lonSum += b.displayLon;
          const k = `${b.area}||${b.sector}`;
          if (!sectorGroups.has(k)) sectorGroups.set(k, { area: b.area, sector: b.sector, pts: [] });
          sectorGroups.get(k).pts.push({ lat: b.displayLat, lon: b.displayLon });
        });

        // 1. Area View (< 16: click to zoom straight in) vs Area Header Badge (>= 16: click for Area grade chart)
        areaGroups.forEach(ag => {
          const avgLon = ag.lonSum / ag.pts.length;
          const avgLat = ag.latSum / ag.pts.length;
          const zoomToArea = () => {
            const bounds = L.latLngBounds(ag.pts.map(p => [p.lat, p.lon]));
            map.fitBounds(bounds, { padding: L.point(30, 30), maxZoom: 17 });
          };

          if (zoom < 16 && sectorVal === "ALL") {
            const areaPoly = L.polygon(computePaddedHull(ag.pts, 0.00085), {
              color: "#f59e0b", weight: 2.5, dashArray: "8, 6", fillColor: "#f59e0b", fillOpacity: 0.15, interactive: true
            });
            areaPoly.on("click", zoomToArea);
            areaPoly.addTo(sectorZoneLayer);
          }

          const badgeLat = (zoom < 16 && sectorVal === "ALL") ? avgLat : (ag.maxLat + 0.0006);
          const areaBadge = L.marker([badgeLat, avgLon], {
            icon: L.divIcon({
              className: "",
              html: `<div class="area-zone-label" style="transform:translate(-50%,-50%);display:inline-block;">${escapeHtml(ag.area)}</div>`,
              iconSize: L.point(0, 0)
            })
          });
          if (zoom < 16 && sectorVal === "ALL") {
            areaBadge.on("click", zoomToArea);
          } else {
            areaBadge.bindPopup(() => buildGradeChartPopup(ag.area, null, true));
          }
          areaBadge.addTo(sectorZoneLayer);
        });

        // 2. Sector Zones (>= 16) with Pixel-Box Collision Filtering (zero overlapping text)
        if (zoom >= 16 || sectorVal !== "ALL") {
          const sortedSectors = Array.from(sectorGroups.values()).sort((a, b) => b.pts.length - a.pts.length);
          const placedBoxes = [];
          let idx = 0;
          sortedSectors.forEach(g => {
            const color = zoneColors[idx++ % zoneColors.length];
            const hull = computePaddedHull(g.pts, 0.00028);
            const poly = L.polygon(hull, {
              color: color, weight: 2, dashArray: "6, 6", fillColor: color, fillOpacity: 0.16, interactive: true
            });
            poly.bindPopup(() => buildGradeChartPopup(g.area, g.sector, false));
            poly.addTo(sectorZoneLayer);

            // Check screen pixel bounding box before placing permanent label
            const center = poly.getBounds().getCenter();
            const pt = map.latLngToContainerPoint(center);
            const halfW = (g.sector.length * 3.8) + 8;
            const halfH = 11;
            const box = { left: pt.x - halfW, right: pt.x + halfW, top: pt.y - halfH, bottom: pt.y + halfH };
            const overlaps = placedBoxes.some(b => !(box.right < b.left || box.left > b.right || box.bottom < b.top || box.top > b.bottom));
            if (!overlaps || sectorVal !== "ALL") {
              placedBoxes.push(box);
              poly.bindTooltip(escapeHtml(g.sector), { permanent: true, direction: "center", className: "sector-zone-label" });
            }
          });
        }
      }

      const zonesToggleEl = document.getElementById("showZonesToggle");
      if (zonesToggleEl) zonesToggleEl.addEventListener("change", renderSectorZones);
      areaSelect.addEventListener("change", renderSectorZones);
      sectorSelect.addEventListener("change", renderSectorZones);
      map.on("zoomend", () => { if (!document.querySelector(".leaflet-popup")) renderSectorZones(); });
      renderSectorZones();

      // Initial Render
      const qsInput=document.getElementById("quickSearchInput"),qsClear=document.getElementById("quickSearchClear"),qsResults=document.getElementById("quickSearchResults");let qsMatches=[];
      const normStr=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
      function runQuickSearch(){
        const raw=qsInput.value.trim(),q=normStr(raw);qsClear.style.display=raw?"block":"none";
        if(!q){qsResults.style.display="none";qsResults.innerHTML="";qsMatches=[];return;}
        const items=[],areas=new Map(),sectors=new Map();
        boulders.forEach(b=>{if(b.lat===null||b.lon===null)return;if(!areas.has(b.area))areas.set(b.area,[]);areas.get(b.area).push(L.latLng(b.displayLat,b.displayLon));const k=b.area+"||"+b.sector;if(!sectors.has(k))sectors.set(k,{area:b.area,sector:b.sector,pts:[]});sectors.get(k).pts.push(L.latLng(b.displayLat,b.displayLon));});
        areas.forEach((pts,a)=>{if(normStr(a).includes(q))items.push({type:"Area",bg:"#0f172a",fg:"#fbbf24",title:a,sub:pts.length+" boulders",go:()=>map.fitBounds(L.latLngBounds(pts),{padding:L.point(30,30),maxZoom:16})});});
        sectors.forEach(s=>{if(normStr(s.sector).includes(q))items.push({type:"Sector",bg:"#dbeafe",fg:"#1e40af",title:s.sector,sub:s.area+" · "+s.pts.length+" boulders",go:()=>map.fitBounds(L.latLngBounds(s.pts),{padding:L.point(35,35),maxZoom:17})});});
        boulders.forEach(b=>{if(b.lat===null||b.lon===null)return;const bm=normStr(b.name).includes(q),pm=b.problems.find(p=>normStr(p.name).includes(q));if(bm||pm)items.push({type:bm?"Boulder":"Problem",bg:"#fef3c7",fg:"#92400e",title:bm?b.name:pm.name+" ("+b.name+")",sub:b.area+" · "+b.sector,go:()=>{map.setView(L.latLng(b.displayLat,b.displayLon),18);setTimeout(()=>{render(false);const m=activeMarkers.find(mk=>mk._boulderRef&&mk._boulderRef.baseKey===b.baseKey);if(m)m.openPopup();},140);}});});
        qsMatches=items.slice(0,18);qsResults.style.display="block";
        qsResults.innerHTML=qsMatches.length?qsMatches.map((it,i)=>`<div class="qs-item" data-qs="${i}"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><strong style="color:#0f172a">${escapeHtml(it.title)}</strong><div style="font-size:10px;color:#64748b">${escapeHtml(it.sub)}</div></div><span class="qs-tag" style="background:${it.bg};color:${it.fg}">${it.type}</span></div>`).join(""):`<div style="padding:10px 12px;font-size:12px;color:#64748b">No matches found</div>`;
        qsResults.querySelectorAll("[data-qs]").forEach(r=>r.onclick=()=>{const c=qsMatches.at(Number(r.dataset.qs));qsResults.style.display="none";if(c)c.go();});
      }
      qsInput.addEventListener("input",runQuickSearch);qsInput.addEventListener("focus",runQuickSearch);
      qsInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&qsMatches.length){e.preventDefault();qsResults.style.display="none";qsMatches.at(0).go();}});
      qsClear.addEventListener("click",()=>{qsInput.value="";runQuickSearch();});
      document.addEventListener("click",e=>{if(!document.getElementById("quickSearchBox").contains(e.target))qsResults.style.display="none";});
      // --- Multi-Photo & Per-Photo Vector Topo Upgrade ---
      const activePhotoIdxMap = new Map();

      function getBoulderPhotoList(boulder) {
        const bKey = `${boulder.sector}||${boulder.name}`;

        const baseImg = boulder.page_image ? (boulder.page_image.includes("/") ? boulder.page_image : `Malveira/${boulder.page_image}`) : "";
        let list = [];
        if (Array.isArray(stored)) list = stored.slice();

      }

      function getPhotoTopos(bKey, idx) {
        const raw = customToposMap.get(bKey);

        if (Array.isArray(raw)) return idx === 0 ? raw : [];
        return Array.isArray(raw[String(idx)]) ? raw[String(idx)] : [];

        const raw = customToposMap.get(bKey);

        obj[String(idx)] = lines;

      const _origWire = wirePopupControls;
      wirePopupControls = function(popup, boulder) {
        _origWire(popup, boulder);
        const el = popup.getElement();
        if (!el) return;
        const bKey = `${boulder.sector}||${boulder.name}`;
        const refreshPopup = () => {

          btn.onclick = () => { activePhotoIdxMap.set(bKey, parseInt(btn.dataset.idx, 10)); refreshPopup(); };
        });

        const addInp = el.querySelector(".mp-add-input");
        if (addInp) addInp.onchange = async ev => {
          const f = ev.target.files && ev.target.files.item(0);
          if (!f) return;
          const dataUrl = await readAndResizePhoto(f);
          const list = getBoulderPhotoList(boulder);
          list.push(dataUrl);
          customPhotosMap.set(bKey, list);
          if (typeof saveBoulderPhoto === "function") await saveBoulderPhoto(bKey, list);
          activePhotoIdxMap.set(bKey, list.length - 1);
          refreshPopup();
        };

        const repInp = el.querySelector(".mp-rep-input");
        if (repInp) repInp.onchange = async ev => {
          const f = ev.target.files && ev.target.files.item(0);
          if (!f) return;
          const dataUrl = await readAndResizePhoto(f);
          const list = getBoulderPhotoList(boulder);
          const idx = activePhotoIdxMap.get(bKey) || 0;
          list.splice(idx, 1, dataUrl);
          customPhotosMap.set(bKey, list);
          if (typeof saveBoulderPhoto === "function") await saveBoulderPhoto(bKey, list);
          refreshPopup();
        };

        const delBtn = el.querySelector(".mp-del-photo-btn");
        if (delBtn) delBtn.onclick = async () => {
          const list = getBoulderPhotoList(boulder);
          const idx = activePhotoIdxMap.get(bKey) || 0;
          list.splice(idx, 1);
          customPhotosMap.set(bKey, list);
          if (typeof saveBoulderPhoto === "function") await saveBoulderPhoto(bKey, list);
          activePhotoIdxMap.set(bKey, Math.max(0, idx - 1));
          refreshPopup();
        };
      };

      const _origOpenDraw = openDrawLineModal;
      openDrawLineModal = function(boulder, popup, imgSrc) {
        const bKey = `${boulder.sector}||${boulder.name}`;
        const idx = activePhotoIdxMap.get(bKey) || 0;
        const list = getBoulderPhotoList(boulder);
        const activeSrc = list.at(idx) || imgSrc;
        _origOpenDraw(boulder, popup, activeSrc);
        localTopos = JSON.parse(JSON.stringify(getPhotoTopos(bKey, idx)));
        renderDrawSvg();
      };

      drawSaveBtn.onclick = async () => {
        if (!drawActiveBoulder) return;
        const bKey = `${drawActiveBoulder.sector}||${drawActiveBoulder.name}`;
        const idx = activePhotoIdxMap.get(bKey) || 0;
        await setPhotoTopos(bKey, idx, localTopos);
        if (drawActivePopup) {
          drawActivePopup.setContent(buildBoulderPopup(drawActiveBoulder, gradeFilterEl.value, searchFilterEl.value.trim().toLowerCase()));
          drawActivePopup.update();
          wirePopupControls(drawActivePopup, drawActiveBoulder);
        }
        closeDrawLineModal();
      };

      // Load baked backup state if present
      try {
        const bakedNode = document.getElementById("baked-state-json");
        if (bakedNode && bakedNode.textContent.trim()) {
          const bs = JSON.parse(bakedNode.textContent);
          if (bs.edits) Object.assign(savedStore.edits, bs.edits);
          if (bs.created && Array.isArray(bs.created)) {
            bs.created.forEach(c => { if (!savedStore.created.some(x => x.baseKey === c.baseKey)) savedStore.created.push(c); });
          }
          if (bs.deleted && Array.isArray(bs.deleted)) {
            bs.deleted.forEach(d => { if (!savedStore.deleted.includes(d)) savedStore.deleted.push(d); });
          }
          if (bs.photos) Object.entries(bs.photos).forEach(([k, v]) => customPhotosMap.set(k, v));
          if (bs.topos) Object.entries(bs.topos).forEach(([k, v]) => customToposMap.set(k, v));
          if (typeof refreshCollections === "function") refreshCollections();
        }
      } catch (e) { console.warn("Baked state parse:", e); }

      // --- Full-Height SVG Drawing + Interactive Lightbox with Hover Problem/Grade Tooltip ---
      if (typeof drawBgImg !== "undefined" && typeof drawSvg !== "undefined") {
        const stageParent = drawBgImg.parentElement;
        if (stageParent) {
          stageParent.style.position = "relative";
          stageParent.style.display = "inline-block";
          stageParent.style.lineHeight = "0";
        }
        drawSvg.style.position = "absolute";
        drawSvg.style.top = "0";
        drawSvg.style.left = "0";
        drawSvg.style.width = "100%";
        drawSvg.style.height = "100%";
        drawSvg.style.pointerEvents = "auto";
        drawSvg.style.touchAction = "none";

        getSvgPoint = function(ev) {
          const rect = drawBgImg.getBoundingClientRect();
          const cx = ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches.item(0) ? ev.touches.item(0).clientX : rect.left);
          const cy = ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches.item(0) ? ev.touches.item(0).clientY : rect.top);
          const x = Math.max(0, Math.min(1000, ((cx - rect.left) / Math.max(1, rect.width)) * 1000));
          const y = Math.max(0, Math.min(1000, ((cy - rect.top) / Math.max(1, rect.height)) * 1000));
          return { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
        };
      }

      window.openPhotoLightbox = function(imgSrc, altText, bKey) {
        let lb = document.getElementById("customTopoLightbox");
        if (!lb) {
          lb = document.createElement("div");
          lb.id = "customTopoLightbox";
          lb.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(10,15,25,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif;";
          document.body.appendChild(lb);
        }

        const boulder = boulders.find(b => `${b.sector}||${b.name}` === bKey);
        const photoIdx = activePhotoIdxMap.get(bKey) || 0;
        const topos = getPhotoTopos(bKey, photoIdx);
        const problems = boulder ? boulder.problems : [];

        lb.innerHTML = `
          <button type="button" id="ctlCloseBtn" style="position:fixed;top:16px;right:20px;width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.15);color:#fff;font-size:20px;cursor:pointer;z-index:10001;">✕</button>
          <div id="ctlHoverTag" style="position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;border:1.5px solid #f59e0b;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;display:none;z-index:10001;white-space:nowrap;"></div>
          <div style="position:relative;display:inline-block;line-height:0;overflow:visible;">
            <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(altText)}" style="width:auto;height:auto;max-width:90vw;max-height:76vh;border-radius:10px;display:block;" />
            <svg id="ctlSvg" viewBox="0 0 1000 1000" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;">
              ${renderVectorTopoMarkup(topos, null)}
            </svg>
          </div>
          <div style="margin-top:10px;color:#e2e8f0;font-size:13px;font-weight:700;text-align:center;">
            ${escapeHtml(altText)}${topos.length ? " — hover or tap a line for name & grade" : ""}
          </div>
        `;
        lb.style.display = "flex";

        const closeLb = () => { lb.style.display = "none"; };
        document.getElementById("ctlCloseBtn").onclick = closeLb;
        lb.onclick = ev => { if (ev.target === lb) closeLb(); };

        const hoverTag = document.getElementById("ctlHoverTag");
        const svgEl = document.getElementById("ctlSvg");
        svgEl.querySelectorAll(".topo-svg-group").forEach(grp => {
          grp.style.cursor = "pointer";
          const pIdx = parseInt(grp.dataset.probIdx, 10);
          const prob = problems.at(pIdx);
          const label = prob ? `${pIdx + 1}. ${prob.name || "Unnamed"} (${prob.grade || "?"})` : `Problem #${pIdx + 1}`;
          const activate = () => {
            svgEl.querySelectorAll(".topo-svg-group").forEach(g => g.style.opacity = g === grp ? "1" : "0.35");
            grp.querySelectorAll("path").forEach(p => { if (!p.dataset.origW) p.dataset.origW = p.getAttribute("stroke-width") || "6"; p.setAttribute("stroke-width", String(Number(p.dataset.origW) * 1.55)); });
            hoverTag.textContent = label;
            hoverTag.style.display = "block";
          };
          const reset = () => {
            svgEl.querySelectorAll(".topo-svg-group").forEach(g => g.style.opacity = "1");
            grp.querySelectorAll("path").forEach(p => { if (p.dataset.origW) p.setAttribute("stroke-width", p.dataset.origW); });
            hoverTag.style.display = "none";
          };
          grp.addEventListener("mouseenter", activate);
          grp.addEventListener("mouseleave", reset);
          grp.addEventListener("click", ev => { ev.stopPropagation(); activate(); });
        });
      };

      // --- Exact Pixel-Box Sync for Draw Modal & Enlarged Lightbox ---
      if (typeof drawBgImg !== "undefined" && typeof drawSvg !== "undefined") {
        const syncDrawBox = () => {
          const p = drawBgImg.parentElement;
          if (p) {
            p.style.cssText = "position:relative;display:inline-block;margin:0 auto;padding:0;line-height:0;overflow:visible;";
          }
          drawBgImg.style.cssText = "display:block;width:auto;height:auto;max-width:86vw;max-height:56vh;object-fit:contain;margin:0;padding:0;";
          drawSvg.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;max-height:none;pointer-events:auto;touch-action:none;overflow:visible;";
        };
        drawBgImg.addEventListener("load", syncDrawBox);
        syncDrawBox();
      }

      // Initial Render
      render();
      fitVisibleMarkers();
      loadAllSavedStorage().then(() => render(false));
    })();
  </script>

<div style="position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:1500;display:flex;gap:8px;background:#0f172a;padding:7px 12px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.35);">
  <button onclick="document.getElementById('sBox').style.display='flex'" style="background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;">📷 Scan Guidebook</button>
  <button onclick="document.getElementById('jBox').style.display='flex'" style="background:#d97706;color:#fff;border:none;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;">💾 JSON Data</button>
</div>
<div id="jBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2500;align-items:center;justify-content:center;padding:12px;">
  <div style="background:#fff;border-radius:12px;max-width:440px;width:100%;padding:16px;font-family:sans-serif;">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><strong>💾 Import Private JSON</strong><button onclick="document.getElementById('jBox').style.display='none'">✕</button></div>
    <input type="file" accept=".json,application/json" onchange="impJson(this.files)" style="width:100%;">
  </div>
</div>
<div id="sBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2500;align-items:center;justify-content:center;padding:12px;">
  <div style="background:#fff;border-radius:12px;max-width:460px;width:100%;max-height:85vh;overflow-y:auto;padding:16px;font-family:sans-serif;">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><strong>📷 Guidebook Scanner</strong><button onclick="document.getElementById('sBox').style.display='none'">✕</button></div>
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <input id="gK" type="password" placeholder="Gemini API Key" style="flex:1;padding:6px;border:1px solid #ccc;border-radius:6px;">
      <button onclick="localStorage.setItem('gk',document.getElementById('gK').value.trim());alert('Saved!')">Save</button>
      <button onclick="testGk()" style="background:#0284c7;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer;">Test</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
      <label style="padding:9px;background:#0f172a;color:#fff;border-radius:8px;font-size:12px;font-weight:700;text-align:center;cursor:pointer;">📸 Snap Page<input type="file" accept="image/*" capture="environment" style="display:none" onchange="qPg(this.files)"></label>
      <label style="padding:9px;background:#f1f5f9;border:1px solid #ccc;border-radius:8px;font-size:12px;font-weight:700;text-align:center;cursor:pointer;">🖼️ Gallery<input type="file" accept="image/*" multiple style="display:none" onchange="qPg(this.files)"></label>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span id="qInf" style="font-size:12px;font-weight:700;color:#2563eb;">0 pages queued</span>
      <button onclick="window.pgs=[];document.getElementById('qInf').textContent='0 pages queued';" style="font-size:11px;border:1px solid #ccc;border-radius:5px;padding:2px 7px;cursor:pointer;">Clear</button>
    </div>
    <button onclick="runSc()" style="width:100%;padding:10px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;">✨ Extract Boulders</button>
    <pre id="sOut" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;font-size:11px;max-height:180px;overflow:auto;margin-top:8px;white-space:pre-wrap;"></pre>
    <button id="addExBtn" onclick="addEx()" style="display:none;width:100%;margin-top:8px;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;">✅ Add Extracted Boulders to Map</button>
  </div>
</div>
<script>
document.getElementById('gK').value = localStorage.getItem('gk') || localStorage.getItem('v28_gemini_key') || '';
window.pgs = [];
window.qPg = async function(fl) {
  for (const f of Array.from(fl || [])) {
    const b64 = await new Promise(res => {
      const r = new FileReader();
      r.onload = () => {
        const im = new Image();
        im.onload = () => {
          const sc = Math.min(1, 1000 / Math.max(im.width, im.height));
          const c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.72).slice(23));
        };
        im.src = r.result;
      };
      r.readAsDataURL(f);
    });
    window.pgs.push(b64);
  }
  document.getElementById('qInf').textContent = window.pgs.length + ' page(s) queued';
};
window.testGk = async function() {
  const k = document.getElementById('gK').value.trim(), out = document.getElementById('sOut');
  if (!k) return alert('Paste API key first.');
  out.textContent = 'Testing...';
  try {
    const h = ['generativelanguage', 'googleapis', 'com'].join('.');
    const r = await fetch('https://' + h + '/v1beta/models?key=' + encodeURIComponent(k));
    const j = await r.json();
    out.textContent = r.ok ? '✅ API Key works!' : ('Error ' + r.status + ': ' + (j.error && j.error.message));
  } catch (e) { out.textContent = 'Network error: ' + e.message; }
};
window.runSc = async function() {
  const k = document.getElementById('gK').value.trim(), out = document.getElementById('sOut');
  if (!k) return alert('Enter API key first.');
  if (!window.pgs.length) return alert('Snap or select at least 1 photo first.');
  out.textContent = '⏳ Extracting ' + window.pgs.length + ' page(s)...';
  try {
    const h = ['generativelanguage', 'googleapis', 'com'].join('.');
    const prompt = 'Extract boulders, problems, grades, GPS coordinates, and sector borders as valid JSON: {"boulders":[{"area":"","sector":"","name":"","lat":null,"lon":null,"problems":[{"name":"","grade":"","desc":""}]}]}';
    const parts = [{ text: prompt }].concat(window.pgs.map(d => ({ inline_data: { mime_type: 'image/jpeg', data: d } })));
    const r = await fetch('https://' + h + '/v1beta/models/gemini-3.8-flash:generateContent?key=' + encodeURIComponent(k), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: parts }], generationConfig: { responseMimeType: 'application/json' } })
    });
    const j = await r.json();
    if (!r.ok) { out.textContent = 'HTTP ' + r.status + ': ' + ((j.error && j.error.message) || JSON.stringify(j)); return; }
    const cand = j.candidates && j.candidates.at(0);
    const part = cand && cand.content && cand.content.parts && cand.content.parts.at(0);
    const txt = (part && part.text) || '{}';
    out.textContent = txt;
    window.exData = JSON.parse(txt);
    document.getElementById('addExBtn').style.display = 'block';
  } catch (e) { out.textContent = 'Error: ' + e.message; }
};
window.addEx = function() {
  const list = (window.exData && window.exData.boulders) || [];
  if (!list.length) return alert('No boulders in extracted JSON.');
  const csvEl = document.getElementById('csv-data');
  const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  let rows = '';
  list.forEach((b, i) => {
    const b64 = window.pgs.at(i);
    const img = b64 ? ('data:image/jpeg;base64,' + b64) : '';
    (b.problems && b.problems.length ? b.problems : [{ name: '', grade: '' }]).forEach(p => {
      rows += '\n' + ['boulder', b.area || 'Sintra', b.sector || 'Scanned', b.name || 'Boulder', p.name || '', p.grade || '', b.lat == null ? '' : b.lat, b.lon == null ? '' : b.lon, b.lat == null ? 'true' : 'false', '', b.comments || '', '', img].map(esc).join(',');
    });
  });
  if (csvEl) csvEl.textContent += rows;
  alert('Added ' + list.length + ' boulders! Click "Download Backup HTML" in the sidebar to save.');
  document.getElementById('sBox').style.display = 'none';
};
window.impJson = async function(fl) {
  const file = fl && fl.item(0);
  if (!file) return;
  const data = JSON.parse(await file.text());
  const csvEl = document.getElementById('csv-data');
  const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  let rows = '';
  (data.boulders || []).forEach(b => {
    (b.problems && b.problems.length ? b.problems : [{ name: '', grade: '' }]).forEach(p => {
      rows += '\n' + ['boulder', b.area || 'Malveira', b.sector || '', b.name || '', p.name || '', p.grade || '', b.lat == null ? '' : b.lat, b.lon == null ? '' : b.lon, b.estimated ? 'true' : 'false', b.description || '', b.comments || '', b.topo_url || '', b.image_url || ''].map(esc).join(',');
    });
  });
  if (csvEl) csvEl.textContent += rows;
  alert('Loaded ' + (data.boulders || []).length + ' boulders! Click "Download Backup HTML" in the sidebar to save.');
  document.getElementById('jBox').style.display = 'none';
};
</script>
</body>
