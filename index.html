<script>
    (function () {
      // Uppercase Grade Canonical Normalizer
      function normalizeGrade(g) {
        let str = String(g || "").trim();
        if (!str || str === "?" || str === "-") return "?";
        if (/^proj/i.test(str)) return "PROJ.";
        return str
          .toUpperCase()
          .replace(/\s+/g, "")
          .replace(/([0-9]+)([A-C])/g, "$1$2");
      }

      function gradeCategory(grade) {
        const g = normalizeGrade(grade);
        if (g === "?" || g === "PROJ." || g === "-") return "PROJ";
        if (["III", "IV", "V", "V+"].includes(g) || /^[345]/.test(g)) return "EASY";
        if (g.startsWith("6")) return "SIX";
        if (g.startsWith("7")) return "SEVEN";
        if (g.startsWith("8")) return "EIGHT";
        return "PROJ";
      }

      function gradeColor(grade) {
        const cat = gradeCategory(grade);
        if (cat === "EASY") return "#22c55e"; // Green (<6A)
        if (cat === "SIX") return "#3b82f6";  // Blue (6A-6C+)
        if (cat === "SEVEN") return "#9333ea";// Purple (7A-7C+)
        if (cat === "EIGHT") return "#18181b";// Black (8A+)
        return "#64748b";                     // Gray (PROJ / ?)
      }

      function gradeClass(grade) {
        const cat = gradeCategory(grade);
        if (cat === "EASY") return "g-easy";
        if (cat === "SIX") return "g-mid";
        if (cat === "SEVEN") return "g-hard";
        if (cat === "EIGHT") return "g-vhard";
        return "g-proj";
      }

      const GRADE_ORDER = [
        "III", "IV", "V", "V+",
        "6A", "6A+", "6B", "6B+", "6C", "6C+",
        "7A", "7A+", "7B", "7B+", "7C", "7C+",
        "8A", "8A+", "8B", "8B+", "8C",
        "PROJ."
      ];

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // RFC-4180 CSV parser
      function parseCSV(text) {
        const rows = [];
        let row = [];
        let val = "";
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          const next = text[i + 1];
          if (inQuotes) {
            if (ch === '"' && next === '"') {
              val += '"';
              i++;
            } else if (ch === '"') {
              inQuotes = false;
            } else {
              val += ch;
            }
          } else {
            if (ch === '"') {
              inQuotes = true;
            } else if (ch === ",") {
              row.push(val.trim());
              val = "";
            } else if (ch === "\n") {
              row.push(val.trim());
              if (row.some(cell => cell !== "")) rows.push(row);
              row = [];
              val = "";
            } else if (ch !== "\r") {
              val += ch;
            }
          }
        }
        if (val !== "" || row.length > 0) {
          row.push(val.trim());
          if (row.some(cell => cell !== "")) rows.push(row);
        }
        const headers = rows[0];
        return rows.slice(1).map(cols => {
          const obj = {};
          headers.forEach((h, idx) => {
            obj[h] = cols[idx] ?? "";
          });
          return obj;
        });
      }

      function gradeMatchesFilter(grade, filterVal) {
        if (filterVal === "ALL") return true;
        const g = normalizeGrade(grade);
        const cat = gradeCategory(g);
        if (filterVal === "BRACKET_EASY") return cat === "EASY";
        if (filterVal === "BRACKET_6") return cat === "SIX";
        if (filterVal === "BRACKET_7") return cat === "SEVEN";
        if (filterVal === "BRACKET_8") return cat === "EIGHT";
        return g.toUpperCase() === filterVal.toUpperCase();
      }

      function inferArea(sector, explicitArea) {
        if (explicitArea && explicitArea.trim()) return explicitArea.trim();
        const s = (sector || "").toLowerCase();
        if (s.includes("cabo") || s.includes("adraga") || s.includes("aroeira") || s.includes("abano") || s.includes("biscaia") || s.includes("cavalo") || s.includes("louriçal") || s.includes("pedra da azoia")) {
          return "Cabo da Roca";
        }
        if (s.includes("coast") || s.includes("assafora") || s.includes("samarra")) {
          return "Coast";
        }
        return "Malveira";
      }

      // Parse embedded CSV
      const rawCsv = document.getElementById("csv-data").textContent;
      const records = parseCSV(rawCsv);

      const boulderMap = new Map();
      const parkingMap = new Map();
      const areasSet = new Set();
      const sectorsSet = new Set();
      const gradesSet = new Set();

      function ingestRecord(r) {
        const area = inferArea(r.sector, r.area);
        if (area) areasSet.add(area);
        if (r.sector) sectorsSet.add(r.sector);

        if (r.type === "boulder") {
          const normG = normalizeGrade(r.grade);
          if (normG && normG !== "?") gradesSet.add(normG);
          const key = `${r.sector}||${r.name}`;
          if (!boulderMap.has(key)) {
            const lat = parseFloat(r.latitude);
            const lon = parseFloat(r.longitude);
            boulderMap.set(key, {
              type: "boulder",
              area,
              sector: r.sector,
              name: r.name,
              lat: Number.isFinite(lat) ? lat : null,
              lon: Number.isFinite(lon) ? lon : null,
              estimated: r.estimated === "true",
              image_url: "",
              baseKey: r.baseKey || key,
              topo_url: r.topo_url || "",
              description: r.description || "",
              comments: r.comments || "",
              isCustom: Boolean(r.isCustom),
              imageUrls: new Set(),
              problems: []
            });
          }
          const b = boulderMap.get(key);
          if (r.area) b.area = r.area;
          if (r.estimated === "true") b.estimated = true;
          if (r.topo_url && !b.topo_url) b.topo_url = r.topo_url;
          if (r.description && !b.description) b.description = r.description;
          if (r.image_url) {
            r.image_url
              .split(/\s*\|\s*|\s+/)
              .map(s => s.trim())
              .filter(Boolean)
              .forEach(u => {
                if (!b.image_url) b.image_url = u;
                b.imageUrls.add(u);
              });
          }
          if (Array.isArray(r.extra_image_urls)) {
            r.extra_image_urls.forEach(u => {
              if (u) {
                if (!b.image_url) b.image_url = u;
                b.imageUrls.add(u);
              }
            });
          }
          b.problems.push({
            name: r.problem_name || "?",
            grade: normG,
            desc: r.problem_desc || ""
          });
        } else if (r.type === "parking") {
          const lat = parseFloat(r.latitude);
          const lon = parseFloat(r.longitude);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
          const key = `${lat.toFixed(6)},${lon.toFixed(6)}`;
          if (!parkingMap.has(key)) {
            parkingMap.set(key, {
              type: "parking",
              lat,
              lon,
              names: new Set(),
              areas: new Set(),
              sectors: new Set(),
              topo_url: r.topo_url || "",
              description: r.description || ""
            });
          }
          const p = parkingMap.get(key);
          if (r.name) p.names.add(r.name);
          if (area) p.areas.add(area);
          if (r.sector) p.sectors.add(r.sector);
          if (r.topo_url && !p.topo_url) p.topo_url = r.topo_url;
          if (r.description && !p.description) p.description = r.description;
        }
      }

      records.forEach(ingestRecord);

      let boulders = [];
      let parkings = [];

      function refreshCollections() {
        boulders = Array.from(boulderMap.values());
        parkings = Array.from(parkingMap.values());

        // Offset identical coordinates slightly for clean pin visibility
        const coordBuckets = new Map();
        boulders.forEach(b => {
          if (b.lat === null || b.lon === null) return;
          const cKey = `${b.lat.toFixed(6)},${b.lon.toFixed(6)}`;
          if (!coordBuckets.has(cKey)) coordBuckets.set(cKey, []);
          coordBuckets.get(cKey).push(b);
        });
        coordBuckets.forEach(group => {
          if (group.length > 1) {
            group.forEach((b, idx) => {
              const angle = (2 * Math.PI * idx) / group.length;
              b.displayLat = b.lat + Math.sin(angle) * 0.00004;
              b.displayLon = b.lon + Math.cos(angle) * 0.00005;
            });
          } else {
            group[0].displayLat = group[0].lat;
            group[0].displayLon = group[0].lon;
          }
        });
      }

      const areaSelect = document.getElementById("areaFilter");
      const sectorSelect = document.getElementById("sectorFilter");
      const exactGradeGroup = document.getElementById("exactGradeGroup");

      function populateDropdowns() {
        const prevArea = areaSelect.value || "ALL";
        const prevSector = sectorSelect.value || "ALL";
        const prevGrade = document.getElementById("gradeFilter") ? document.getElementById("gradeFilter").value : "ALL";

        areaSelect.innerHTML = '<option value="ALL">All Areas</option>';
        ["Malveira", "Cabo da Roca", "Coast"].forEach(a => {
          const opt = document.createElement("option");
          opt.value = a;
          opt.textContent = a;
          areaSelect.appendChild(opt);
        });
        Array.from(areasSet).forEach(a => {
          if (!["Malveira", "Cabo da Roca", "Coast"].includes(a)) {
            const opt = document.createElement("option");
            opt.value = a;
            opt.textContent = a;
            areaSelect.appendChild(opt);
          }
        });
        if (Array.from(areasSet).includes(prevArea) || prevArea === "ALL") {
          areaSelect.value = prevArea;
        }

        sectorSelect.innerHTML = '<option value="ALL">All Sectors</option>';
        Array.from(sectorsSet).sort().forEach(sec => {
          const opt = document.createElement("option");
          opt.value = sec;
          opt.textContent = sec;
          sectorSelect.appendChild(opt);
        });
        if (Array.from(sectorsSet).includes(prevSector) || prevSector === "ALL") {
          sectorSelect.value = prevSector;
        }

        exactGradeGroup.innerHTML = "";
        const gradeOrderUpper = GRADE_ORDER.map(x => x.toUpperCase());
        Array.from(gradesSet)
          .sort((a, b) => {
            const ia = gradeOrderUpper.indexOf(a);
            const ib = gradeOrderUpper.indexOf(b);
            if (ia !== -1 && ib !== -1) return ia - ib;
            if (ia !== -1) return -1;
            if (ib !== -1) return 1;
            return a.localeCompare(b);
          })
          .forEach(g => {
            const opt = document.createElement("option");
            opt.value = g;
            opt.textContent = g;
            exactGradeGroup.appendChild(opt);
          });
        if (document.getElementById("gradeFilter")) {
          document.getElementById("gradeFilter").value = prevGrade;
        }

        document.getElementById("areaSuggestions").innerHTML = Array.from(areasSet)
          .map(a => `<option value="${escapeHtml(a)}"></option>`)
          .join("");
        document.getElementById("sectorSuggestions").innerHTML = Array.from(sectorsSet)
          .map(s => `<option value="${escapeHtml(s)}"></option>`)
          .join("");
      }

      // KML Parser with support for multiple <img src="..."> in description
      function stripHtmlTags(htmlText) {
        if (!htmlText) return "";
        const tmp = document.createElement("div");
        tmp.innerHTML = htmlText;
        return (tmp.textContent || tmp.innerText || "").replace(/\s+/g, " ").trim();
      }

      function parseAndMergeKml(kmlText, defaultGroup = "Coast") {
        if (!kmlText || !kmlText.trim()) return { bouldersAdded: 0, parkingsAdded: 0 };
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(kmlText, "application/xml");
        if (xmlDoc.querySelector("parsererror")) {
          throw new Error("Invalid KML XML format");
        }

        const placemarks = Array.from(xmlDoc.getElementsByTagName("Placemark"));
        let bouldersAdded = 0;
        let parkingsAdded = 0;

        placemarks.forEach(pm => {
          const pointEl = pm.getElementsByTagName("Point")[0];
          if (!pointEl) return;
          const coordText = (pointEl.getElementsByTagName("coordinates")[0]?.textContent || "").trim();
          if (!coordText) return;
          const parts = coordText.split(",").map(s => parseFloat(s.trim()));
          const lon = parts[0];
          const lat = parts[1];
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

          const name = (pm.getElementsByTagName("name")[0]?.textContent || "Unnamed Pin").trim();
          const rawDesc = pm.getElementsByTagName("description")[0]?.textContent || "";
          const extractedUrls = [];
          const seenUrls = new Set();
          function pushImageUrl(u) {
            const clean = (u || "").trim();
            if (!clean || !/^https?:\/\//i.test(clean)) return;
            if (clean.includes("gstatic.com/mapspro/images/stock/")) return;
            if (!seenUrls.has(clean)) {
              seenUrls.add(clean);
              extractedUrls.push(clean);
            }
          }

          if (rawDesc) {
            const imgAttrRegex = /<img[^>]+src=["'](https?:\/\/[^"']+)["']/gi;
            let match;
            while ((match = imgAttrRegex.exec(rawDesc)) !== null) {
              pushImageUrl(match[1]);
            }
          }

          Array.from(pm.getElementsByTagName("Data")).forEach(dataEl => {
            if (dataEl.getAttribute("name") === "gx_media_links") {
              const val = dataEl.getElementsByTagName("value")[0]?.textContent || "";
              const urlMatches = val.match(/https?:\/\/[^\s"'<>]+/gi) || [];
              urlMatches.forEach(pushImageUrl);
            }
          });

          const desc = stripHtmlTags(rawDesc);
          const folderNames = [];
          let parent = pm.parentElement;
          while (parent) {
            if (parent.tagName === "Folder") {
              const nameEl = Array.from(parent.children).find(el => el.tagName === "name");
              const fName = nameEl ? nameEl.textContent.trim() : "";
              if (fName) folderNames.unshift(fName);
            }
            parent = parent.parentElement;
          }
          const folderLabel = folderNames.join(" / ");
          const sectorName = folderLabel
            ? (folderLabel.toLowerCase().includes(defaultGroup.toLowerCase()) ? folderLabel : `${defaultGroup} — ${folderLabel}`)
            : defaultGroup;

          const lowerCheck = `${name} ${folderLabel}`.toLowerCase();
          const isParking = /\b(parking|estacionamento|park|car\s*park)\b/i.test(lowerCheck);

          if (isParking) {
            ingestRecord({
              type: "parking",
              area: "Coast",
              sector: sectorName,
              name,
              latitude: String(lat),
              longitude: String(lon),
              description: desc
            });
            parkingsAdded++;
          } else {
            // Check if boulder exists already by coordinates to attach images without duplicating
            let matched = false;
            boulderMap.forEach(b => {
              if (b.lat !== null && b.lon !== null && Math.abs(b.lat - lat) < 0.00008 && Math.abs(b.lon - lon) < 0.00008) {
                extractedUrls.forEach(u => {
                  if (!b.image_url) b.image_url = u;
                  b.imageUrls.add(u);
                });
                matched = true;
              }
            });
            if (!matched) {
              ingestRecord({
                type: "boulder",
                area: "Coast",
                sector: sectorName,
                name,
                problem_name: name,
                grade: "?",
                latitude: String(lat),
                longitude: String(lon),
                image_url: extractedUrls[0] || "",
                extra_image_urls: extractedUrls,
                estimated: "false",
                description: desc
              });
              bouldersAdded++;
            }
          }
        });

        refreshCollections();
        populateDropdowns();
        return { bouldersAdded, parkingsAdded };
      }

      // LocalStorage + Baked State Persistence
      const STORAGE_KEY = "sintra_map_edits_v2";
      let customIdCounter = 0;

      function loadBakedState() {
        try {
          const el = document.getElementById("baked-state-json");
          if (!el || !el.textContent || !el.textContent.trim()) {
            return { edits: {}, created: [], deleted: [], photos: {}, topos: {} };
          }
          const parsed = JSON.parse(el.textContent);
          return {
            edits: parsed && typeof parsed.edits === "object" && parsed.edits ? parsed.edits : {},
            created: parsed && Array.isArray(parsed.created) ? parsed.created : [],
            deleted: parsed && Array.isArray(parsed.deleted) ? parsed.deleted : [],
            photos: parsed && typeof parsed.photos === "object" && parsed.photos ? parsed.photos : {},
            topos: parsed && typeof parsed.topos === "object" && parsed.topos ? parsed.topos : {}
          };
        } catch (err) {
          console.warn("Could not parse baked state JSON:", err);
          return { edits: {}, created: [], deleted: [], photos: {}, topos: {} };
        }
      }

      const bakedState = loadBakedState();

      function loadSavedStore() {
        try {
          const raw = window.localStorage ? window.localStorage.getItem(STORAGE_KEY) : null;
          if (!raw) {
            return {
              edits: Object.assign({}, bakedState.edits),
              created: bakedState.created.slice(),
              deleted: bakedState.deleted.slice()
            };
          }
          const parsed = JSON.parse(raw);
          const localEdits = parsed && typeof parsed.edits === "object" && parsed.edits ? parsed.edits : {};
          const localCreated = parsed && Array.isArray(parsed.created) ? parsed.created : [];
          const localDeleted = parsed && Array.isArray(parsed.deleted) ? parsed.deleted : [];

          const mergedCreatedMap = new Map();
          bakedState.created.forEach(item => {
            if (item && (item.baseKey || item.id)) mergedCreatedMap.set(item.baseKey || item.id, item);
          });
          localCreated.forEach(item => {
            if (item && (item.baseKey || item.id)) mergedCreatedMap.set(item.baseKey || item.id, item);
          });

          const mergedDeleted = Array.from(new Set([...bakedState.deleted, ...localDeleted]));

          return {
            edits: Object.assign({}, bakedState.edits, localEdits),
            created: Array.from(mergedCreatedMap.values()),
            deleted: mergedDeleted
          };
        } catch (err) {
          console.warn("Could not read saved edits from localStorage:", err);
          return {
            edits: Object.assign({}, bakedState.edits),
            created: bakedState.created.slice(),
            deleted: bakedState.deleted.slice()
          };
        }
      }

      const savedStore = loadSavedStore();

      function persistSavedStore() {
        try {
          if (window.localStorage) {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(savedStore));
          }
        } catch (err) {
          console.warn("Could not save edits to localStorage:", err);
        }
      }

      function applySavedStoreToMap() {
        // Delete boulders marked deleted
        (savedStore.deleted || []).forEach(k => {
          boulderMap.delete(k);
        });

        // Apply edits
        Object.entries(savedStore.edits).forEach(([baseKey, edit]) => {
          const b = boulderMap.get(baseKey);
          if (!b || !edit || typeof edit !== "object") return;
          if (typeof edit.name === "string" && edit.name.trim()) b.name = edit.name.trim();
          if (typeof edit.area === "string" && edit.area.trim()) b.area = edit.area.trim();
          if (typeof edit.sector === "string" && edit.sector.trim()) b.sector = edit.sector.trim();
          if (typeof edit.comments === "string") b.comments = edit.comments;
          if (Number.isFinite(edit.lat) && Number.isFinite(edit.lon)) {
            b.lat = edit.lat;
            b.lon = edit.lon;
            b.estimated = false;
          }
          if (Array.isArray(edit.problems)) {
            b.problems = edit.problems.map(p => {
              const normG = normalizeGrade((p && p.grade) || "");
              if (normG && normG !== "?") gradesSet.add(normG);
              return {
                name: String((p && p.name) || "?").trim() || "?",
                grade: normG,
                desc: String((p && p.desc) || "").trim()
              };
            });
          }
        });

        // Add custom created boulders
        savedStore.created.forEach(item => {
          if (!item || !item.name || !item.sector) return;
          const bKey = item.baseKey || item.id || `custom_${Date.now()}_${++customIdCounter}`;
          if (savedStore.deleted.includes(bKey)) return;
          const lat = parseFloat(item.lat);
          const lon = parseFloat(item.lon);
          const area = inferArea(item.sector, item.area);
          if (area) areasSet.add(area);
          if (item.sector) sectorsSet.add(item.sector);
          const probs = Array.isArray(item.problems)

                return {
                  name: String((p && p.name) || "?").trim() || "?",
                  grade: normG,
                  desc: String((p && p.desc) || "").trim()
                };
              })
            : [];
          boulderMap.set(bKey, {
            type: "boulder",
            baseKey: bKey,
            area,
            sector: item.sector,
            name: item.name,
            lat: Number.isFinite(lat) ? lat : null,
            lon: Number.isFinite(lon) ? lon : null,
            estimated: false,
            isCustom: true,
            image_url: item.image_url || "",
            topo_url: "",
            description: "",
            comments: typeof item.comments === "string" ? item.comments : "",
            imageUrls: new Set(item.image_url ? [item.image_url] : []),
            problems: probs
          });
        });

      function openAppDB() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) return reject(new Error("IndexedDB not supported"));
          let settled = false;
          const timer = setTimeout(() => {
            if (!settled) {
              settled = true;
              reject(new Error("IndexedDB timeout"));
            }
          }, 1500);
          const req = window.indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("photos")) db.createObjectStore("photos", { keyPath: "id" });
            if (!db.objectStoreNames.contains("topos")) db.createObjectStore("topos", { keyPath: "id" });
          };
          req.onsuccess = e => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            resolve(e.target.result);
          };
          req.onerror = e => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            reject(e.target.error || new Error("IndexedDB error"));
          };
        });
      }

      async function loadAllSavedStorage() {
        try {

          await new Promise(res => {
            const tx = db.transaction(["photos", "topos"], "readonly");
            const pStore = tx.objectStore("photos");
            const tStore = tx.objectStore("topos");
            pStore.getAll().onsuccess = e => {
              (e.target.result || []).forEach(r => {
                if (r && r.id && r.dataUrl) customPhotosMap.set(r.id, r.dataUrl);
              });

            tStore.getAll().onsuccess = e => {
              (e.target.result || []).forEach(r => {
                if (r && r.id && r.topos) customToposMap.set(r.id, r.topos);
              });
            };
            tx.oncomplete = () => res();
            tx.onerror = () => res();
          });
        } catch (e) {
          console.warn("Storage load warning:", e);
        }
      }

      function readAndResizePhoto(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("Failed to read file"));
          reader.onload = ev => {
            const rawDataUrl = String(ev.target.result || "");
            const img = new Image();
            img.onload = () => {
              try {
                const maxDim = 1200;
                let w = img.naturalWidth || img.width;
                let h = img.naturalHeight || img.height;
                if (w > maxDim || h > maxDim) {
                  const scale = maxDim / Math.max(w, h);
                  w = Math.round(w * scale);
                  h = Math.round(h * scale);
                }
                const canvas = document.createElement("canvas");
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext("2d");
                if (!ctx) return resolve(rawDataUrl);
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL("image/jpeg", 0.8));
              } catch (_) {
                resolve(rawDataUrl);
              }
            };
            img.onerror = () => resolve(rawDataUrl);
            img.src = rawDataUrl;
          };
          reader.readAsDataURL(file);
        });
      }

      // Area & Sector Stats Calculator & Grade Distribution Chart
      function computeStats(filterFn) {
        let bCount = 0;
        let pCount = 0;
        const counts = { EASY: 0, SIX: 0, SEVEN: 0, EIGHT: 0, PROJ: 0 };
        boulders.forEach(b => {
          if (!filterFn(b)) return;
          bCount++;
          b.problems.forEach(p => {
            pCount++;
            const cat = gradeCategory(p.grade);
            counts[cat] = (counts[cat] || 0) + 1;
          });
        });
        return { bCount, pCount, counts };
      }

      // SVG Topo Rendering & Smoothing Math
      function renderVectorTopoMarkup(topos, activeProblemIdx) {
        if (!Array.isArray(topos) || topos.length === 0) return "";
        return topos.map(topo => {
          const isAct = activeProblemIdx !== null && activeProblemIdx !== undefined && topo.probIdx === activeProblemIdx;
          const strokeColor = topo.color || "#ef4444";
          const strokeWidth = (topo.width || 5) * 2;
          const outlineWidth = strokeWidth + 4;
          const isHighlightedClass = isAct ? " is-highlighted" : "";

          let badgeHtml = "";
          if (topo.badge && topo.badge.x !== undefined && topo.badge.y !== undefined) {
            badgeHtml = `
              <circle cx="${topo.badge.x}" cy="${topo.badge.y}" r="22" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
              <text x="${topo.badge.x}" y="${topo.badge.y + 7}" fill="#ffffff" font-size="19" font-weight="800" text-anchor="middle">${escapeHtml(topo.badge.text)}</text>
            `;
          }

          let stampsHtml = "";
          (topo.stamps || []).forEach(st => {
            stampsHtml += `
              <rect x="${st.x - 30}" y="${st.y - 18}" width="60" height="28" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
              <text x="${st.x}" y="${st.y + 2}" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">${escapeHtml(st.text)}</text>
            `;
          });

          return `
            <g class="topo-svg-group${isHighlightedClass}" data-prob-idx="${topo.probIdx}">
              <path class="topo-hit-path" d="${topo.d}" />
              <path class="topo-outline-path" d="${topo.d}" stroke-width="${outlineWidth}" />
              <path class="topo-visible-path" d="${topo.d}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />
              ${badgeHtml}
              ${stampsHtml}
            </g>
          `;
        }).join("");
      }

      function pointsToSmoothPathD(pts) {
        if (!pts || pts.length === 0) return "";
        if (pts.length === 1) return `M ${pts[0].x} ${pts[0].y} L ${pts[0].x + 0.1} ${pts[0].y + 0.1}`;
        if (pts.length === 2) return `M ${pts[0].x} ${pts[0].y} L ${pts[1].x} ${pts[1].y}`;

        let d = `M ${pts[0].x} ${pts[0].y}`;
        for (let i = 1; i < pts.length - 1; i++) {
          const xc = (pts[i].x + pts[i + 1].x) / 2;
          const yc = (pts[i].y + pts[i + 1].y) / 2;
          d += ` Q ${pts[i].x} ${pts[i].y}, ${xc} ${yc}`;
        }
        d += ` L ${pts[pts.length - 1].x} ${pts[pts.length - 1].y}`;
        return d;
      }

            </div>
          </div>
        `;
      }

      function buildBoulderPopup(boulder, gradeVal, searchVal) {
        const gMapsUrl = `https://www.google.com/maps/search/?api=1&query=${boulder.lat},${boulder.lon}`;
        const estTag = boulder.estimated ? ' <span class="est-label">(Estimated)</span>' : '';
        const descHtml = boulder.description
          ? `<div class="popup-description">${escapeHtml(boulder.description)}</div>`
          : '';
        const topoLabel = boulder.topo_url && boulder.topo_url.includes("cabodaroca.pt")
          ? "View Sector Topo on cabodaroca.pt &nearr;"
          : "View Sector Topo &nearr;";
        const topoHtml = boulder.topo_url
          ? `<div class="popup-topo-wrap"><a class="popup-topo-link" href="${escapeHtml(boulder.topo_url)}" target="_blank" rel="noopener">${topoLabel}</a></div>`
          : '';

        const problemItems = boulder.problems
          .map((p, idx) => {
            const gMatch = gradeMatchesFilter(p.grade, gradeVal);
            const sMatch = !searchVal || p.name.toLowerCase().includes(searchVal);
            const isHighlighted = (gradeVal !== "ALL" || searchVal !== "") && gMatch && sMatch;
            const desc = p.desc ? `<div class="problem-item-desc">${escapeHtml(p.desc)}</div>` : "";
            return `
              <li class="problem-item ${isHighlighted ? "highlighted" : ""}" data-prob-idx="${idx}">
                <div class="problem-item-row">
                  <span><strong>${idx + 1}.</strong> ${escapeHtml(p.name)}</span>
                  <span class="grade-pill ${gradeClass(p.grade)}">${escapeHtml(p.grade || "-")}</span>
                </div>
                ${desc}
              </li>
            `;
          })
          .join("");

        const commentsHtml = boulder.comments && boulder.comments.trim()
          ? `<div class="popup-comments"><span class="popup-comments-lbl">Comments:</span> ${escapeHtml(boulder.comments)}</div>`
          : "";

        return `
          <div class="popup-box">
            <div class="popup-header">
              <div class="popup-header-top">
                <div>
                  <div class="popup-sector">${escapeHtml(boulder.area || "Sintra")} &bull; ${escapeHtml(boulder.sector)}${boulder.estimated ? " &bull; Estimated Pin" : ""}</div>
                  <div class="popup-title">${escapeHtml(boulder.name)}</div>
                </div>
                <button type="button" class="popup-edit-btn" title="Edit boulder name, location, problems &amp; comments">&#9998; Edit</button>
              </div>
              <div class="popup-coords">
                <span>${boulder.lat !== null ? `${boulder.lat.toFixed(6)}, ${boulder.lon.toFixed(6)}` : "No GPS"}${estTag}</span>
                <a href="${gMapsUrl}" target="_blank" rel="noopener">Google Maps &nearr;</a>
              </div>
            </div>
            <div class="popup-body">
              ${descHtml}
              ${commentsHtml}
              <ul class="problem-list">${problemItems}</ul>
              ${topoHtml}
              ${buildBoulderPhotoStage(boulder)}
              <div class="popup-footer-actions">
                <button type="button" class="btn-danger-outline popup-delete-btn" title="Delete boulder permanently">&#128465; Delete Boulder</button>
              </div>
            </div>
          </div>
        `;
      }

      function buildProblemEditCard(nameVal, gradeVal, descVal) {
        return `
          <div class="pe-prob-card">
            <div class="pe-prob-row">
              <input type="text" class="pe-input pe-prob-name" value="${escapeHtml(nameVal)}" placeholder="Problem name" />
              <input type="text" class="pe-input pe-prob-grade" list="gradeSuggestions" value="${escapeHtml(gradeVal)}" placeholder="Grade" />
              <button type="button" class="pe-del-prob" title="Remove problem">&times;</button>
            </div>
            <input type="text" class="pe-input pe-prob-desc" value="${escapeHtml(descVal || "")}" placeholder="Beta / route description (optional)" />
          </div>
        `;
      }

      function buildBoulderEditFormHtml(boulder) {
        const rows = (boulder.problems.length > 0 ? boulder.problems : [{ name: "", grade: "", desc: "" }])
          .map(p => buildProblemEditCard(p.name, p.grade, p.desc))
          .join("");

        return `
          <div class="popup-box">
            <div class="popup-header">
              <div class="popup-sector">${escapeHtml(boulder.sector)} &bull; Editing</div>
              <div class="popup-title">${escapeHtml(boulder.name)}</div>
            </div>
            <div class="popup-body" style="max-height: 52vh;">
              <form class="popup-edit-form">
                <div class="pe-field">
                  <label class="pe-label">Area &amp; Sector</label>
                  <div class="modal-coords-grid">
                    <input type="text" class="pe-input pe-area" list="areaSuggestions" value="${escapeHtml(boulder.area || "Malveira")}" placeholder="Area" />
                    <input type="text" class="pe-input pe-sector" list="sectorSuggestions" value="${escapeHtml(boulder.sector)}" placeholder="Sector" required />
                  </div>
                </div>
                <div class="pe-field">
                  <label class="pe-label">Boulder Name</label>
                  <input type="text" class="pe-input pe-name" value="${escapeHtml(boulder.name)}" required />
                </div>
                <div class="pe-field">
                  <label class="pe-label">Location Tools</label>
                  <div class="pe-loc-tools">
                    <button type="button" class="btn modal-move-btn pe-move-pin-btn">&#128205; Move Pin on Map</button>
                    <button type="button" class="btn modal-gps-btn pe-use-gps-btn">&#127919; Use Current GPS</button>
                  </div>
                  <div class="modal-coords-grid">
                    <input type="number" step="0.000001" class="pe-input pe-lat" value="${boulder.lat !== null ? boulder.lat.toFixed(6) : ""}" placeholder="Latitude" />
                    <input type="number" step="0.000001" class="pe-input pe-lon" value="${boulder.lon !== null ? boulder.lon.toFixed(6) : ""}" placeholder="Longitude" />
                  </div>
                </div>
                <div class="pe-field">
                  <label class="pe-label">Problems, Grades &amp; Descriptions</label>
                  <div class="pe-prob-list">${rows}</div>
                  <button type="button" class="pe-add-prob">+ Add Problem</button>
                </div>
                <div class="pe-field">
                  <label class="pe-label">Comments / Beta Notes</label>
                  <textarea class="pe-textarea pe-comments" placeholder="Personal beta, landing notes...">${escapeHtml(boulder.comments || "")}</textarea>
                </div>
                <div class="pe-error"></div>
                <div class="pe-actions">
                  <button type="button" class="btn-danger-outline pe-delete-btn">&#128465; Delete</button>
                  <div class="btn-group">
                    <button type="button" class="btn pe-cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary pe-save-btn">Save</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      function buildParkingPopup(p) {
        const namesList = Array.from(p.names).join(" / ");
        const sectorsList = Array.from(p.sectors).join(", ");
        const gMapsUrl = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`;
        const descHtml = p.description
          ? `<div class="popup-description" style="margin-top:8px;">${escapeHtml(p.description)}</div>`
          : '';
        const topoHtml = p.topo_url
          ? `<div class="popup-topo-wrap"><a class="popup-topo-link" href="${escapeHtml(p.topo_url)}" target="_blank" rel="noopener">View Sector Topo &nearr;</a></div>`
          : '';
        return `
          <div class="popup-box">
            <div class="popup-header parking-hdr">
              <div class="popup-sector">Parking</div>
              <div class="popup-title">${escapeHtml(namesList)}</div>
              <div class="popup-coords">
                <span>${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</span>
                <a href="${gMapsUrl}" target="_blank" rel="noopener">Navigate &nearr;</a>
              </div>
            </div>
            <div class="popup-body">
              <div style="font-size:0.83rem;color:#334155;">
                <strong>Serves sectors:</strong> ${escapeHtml(sectorsList)}
              </div>
              ${descHtml}
              ${topoHtml}
            </div>
          </div>
        `;
      }

      // Sidebar & List Rendering (Capped at 25 items for 60fps)
      const gradeFilterEl = document.getElementById("gradeFilter");
      const searchFilterEl = document.getElementById("searchFilter");
      const showParkingEl = document.getElementById("showParking");
      const boulderListEl = document.getElementById("boulderList");

      let activeMarkers = [];
      let currentMarkerByKey = new Map();
      let displayedCardsLimit = 25;

      function render(resetLimit = true) {
        if (resetLimit) displayedCardsLimit = 25;
        const areaVal = areaSelect.value;
        const sectorVal = sectorSelect.value;
        const gradeVal = gradeFilterEl.value;
        const searchVal = searchFilterEl.value.trim().toLowerCase();
        const showParking = showParkingEl.checked;

        boulderLayerGroup.clearLayers();
        parkingLayerGroup.clearLayers();
        activeMarkers = [];

        const markerByKey = new Map();

        const filteredBoulders = boulders.filter(b => {
          if (areaVal !== "ALL" && b.area !== areaVal) return false;
          if (sectorVal !== "ALL" && b.sector !== sectorVal) return false;
          const nameMatches = searchVal && b.name.toLowerCase().includes(searchVal);
          const commentMatches = searchVal && (b.comments || "").toLowerCase().includes(searchVal);
          if (b.problems.length === 0) {
            return gradeVal === "ALL" && (!searchVal || nameMatches || commentMatches);
          }
          return b.problems.some(p => {
            const gOk = gradeMatchesFilter(p.grade, gradeVal);
            const sOk = !searchVal || nameMatches || commentMatches || p.name.toLowerCase().includes(searchVal);
            return gOk && sOk;
          });
        });

        let totalMatchingProblems = 0;
        filteredBoulders.forEach(b => {
          totalMatchingProblems += b.problems.filter(p => {
            const gOk = gradeMatchesFilter(p.grade, gradeVal);
            const sOk =
              !searchVal ||
              b.name.toLowerCase().includes(searchVal) ||
              (b.comments || "").toLowerCase().includes(searchVal) ||
              p.name.toLowerCase().includes(searchVal);
            return gOk && sOk;
          }).length;
        });

        let mappedCount = 0;
        const mappedBoulders = [];
        filteredBoulders.forEach(b => { if (b.lat !== null && b.lon !== null) { mappedCount++; mappedBoulders.push(b); } });
        const z = map.getZoom(), vb = map.getBounds().pad(0.25);
        if (z < 16 && sectorVal === "ALL" && !searchVal) {
          // Zoomed out: hide individual boulders and sector pills (Area zone handles this zoom level)
        } else {
          mappedBoulders.forEach(b => {
            if (sectorVal === "ALL" && !searchVal && !vb.contains([b.displayLat, b.displayLon])) return;
            const m = L.circleMarker([b.displayLat, b.displayLon], { radius: 9, fillColor: b.estimated ? "#f59e0b" : "#d97706", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.92 });
            m._boulderRef = b;
            m.bindPopup(() => buildBoulderPopup(b, gradeVal, searchVal));
            m.addTo(boulderLayerGroup); activeMarkers.push(m); markerByKey.set(b.baseKey, m);
          });
        }

        let visibleParkingCount = 0;
        if (showParking) {
          parkings.forEach(p => {
            if (areaVal !== "ALL" && !p.areas.has(areaVal)) return;
            if (sectorVal !== "ALL" && !p.sectors.has(sectorVal)) return;
            visibleParkingCount++;
            const icon = L.divIcon({
              className: "",
              html: `<div class="marker-parking" title="Parking">P</div>`,
              iconSize: [26, 26],
              iconAnchor: [13, 13],
              popupAnchor: [0, -13]
            });
            const marker = L.marker([p.lat, p.lon], { icon });
            marker.bindPopup(buildParkingPopup(p));
            marker.addTo(parkingLayerGroup);
            activeMarkers.push(marker);
          });
        }

        document.getElementById("statMapped").textContent = mappedCount;
        document.getElementById("statProblems").textContent = totalMatchingProblems;
        document.getElementById("statParking").textContent = visibleParkingCount;

        // Render Capped Sidebar List
        const mappedList = filteredBoulders.filter(b => b.lat !== null);
        const unmappedList = filteredBoulders.filter(b => b.lat === null);

        let html = "";
        if (mappedList.length > 0) {
          html += `<div class="list-section-title">Mapped Boulders (${mappedList.length})</div>`;
          const sliceMapped = mappedList.slice(0, displayedCardsLimit);
          html += sliceMapped.map(b => renderCard(b, true, gradeVal)).join("");
          if (mappedList.length > displayedCardsLimit) {
            html += `
              <div class="show-more-wrap">
                <button type="button" class="show-more-btn" id="showMoreCardsBtn">
                  Show More (+25 of ${mappedList.length - displayedCardsLimit} remaining)
                </button>
              </div>
            `;
          }
        }
        if (unmappedList.length > 0) {
          html += `<div class="list-section-title">Unmapped Boulders (${unmappedList.length})</div>`;
          html += unmappedList.map(b => renderCard(b, false, gradeVal)).join("");
        }
        if (filteredBoulders.length === 0) {
          html = `<div style="padding:20px;text-align:center;color:#64748b;font-size:0.86rem;">No boulders match your filters.</div>`;
        }

        currentMarkerByKey = markerByKey;
        boulderListEl.innerHTML = html;

        boulderListEl.querySelectorAll(".boulder-card[data-key]").forEach(card => {
          card.addEventListener("click", () => {
            const m = markerByKey.get(card.dataset.key);
            if (m) {
              map.setView(m.getLatLng(), Math.max(map.getZoom(), 17), { animate: true });
              m.openPopup();
            }
          });
        });

        const showMoreBtn = document.getElementById("showMoreCardsBtn");
        if (showMoreBtn) {
          showMoreBtn.addEventListener("click", () => {
            displayedCardsLimit += 25;
            render(false);
          });
        }

        updateMapLabels();
      }

      function renderCard(b, isMapped, gradeVal) {
        const keyAttr = isMapped ? `data-key="${escapeHtml(b.baseKey)}"` : "";
        const pills = b.problems
          .filter(p => gradeMatchesFilter(p.grade, gradeVal))
          .slice(0, 5)
          .map(p => `<span class="grade-pill ${gradeClass(p.grade)}">${escapeHtml(p.name)} (${escapeHtml(p.grade || "-")})</span>`)
          .join("");
        const extra =
          b.problems.filter(p => gradeMatchesFilter(p.grade, gradeVal)).length > 5
            ? `<span class="grade-pill g-proj">+more</span>`
            : "";

        return `
          <div class="boulder-card ${isMapped ? "" : "unmapped"}" ${keyAttr}>
            <div class="card-top">
              <div>
                <div class="card-title">${escapeHtml(b.name)}</div>
                <div class="card-sector">${escapeHtml(b.area || "Sintra")} &bull; ${escapeHtml(b.sector)} &bull; ${b.problems.length} line${b.problems.length === 1 ? "" : "s"}</div>
              </div>
              <span class="badge ${!isMapped ? "badge-nogps" : (b.estimated ? "badge-est" : "badge-gps")}">${!isMapped ? "No GPS" : (b.estimated ? "Est. GPS" : "GPS")}</span>
            </div>
            <div class="card-problems-preview">${pills}${extra}</div>
          </div>
        `;
      }

      function fitVisibleMarkers() {
        if (activeMarkers.length === 0) return;
        const group = L.featureGroup(activeMarkers);
        map.fitBounds(group.getBounds().pad(0.12), { maxNativeZoom: 18, maxZoom: 22 });
      }

      areaSelect.addEventListener("change", () => {
        render();
        fitVisibleMarkers();
      });
      sectorSelect.addEventListener("change", () => {
        render();
        fitVisibleMarkers();
      });
      gradeFilterEl.addEventListener("change", () => render());
      searchFilterEl.addEventListener("input", () => render());
      showParkingEl.addEventListener("change", () => render());

      document.getElementById("fitBtn").addEventListener("click", fitVisibleMarkers);

      document.getElementById("resetBtn").addEventListener("click", () => {
        areaSelect.value = "ALL";
        sectorSelect.value = "ALL";
        gradeFilterEl.value = "ALL";
        searchFilterEl.value = "";
        showParkingEl.checked = true;
        render();
        map.setView([38.7556, -9.4316], 15);
      });

      // Mobile Responsive Sidebar Setup
      const sidebar = document.getElementById("sidebar");
      const sidebarToggle = document.getElementById("sidebarToggle");
      const sidebarCloseBtn = document.getElementById("sidebarCloseBtn");

      if (window.innerWidth <= 768) {
        sidebar.classList.add("collapsed");
      }

      sidebarToggle.addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");
        setTimeout(() => map.invalidateSize(), 240);
      });

      sidebarCloseBtn.addEventListener("click", () => {
        sidebar.classList.add("collapsed");
        setTimeout(() => map.invalidateSize(), 240);
      });

      // Delete Boulder Action
      async function deleteBoulder(boulder) {
        if (!boulder) return;
        const confirmDelete = window.confirm(`Permanently delete "${boulder.name}" from map, list, and backups?`);
        if (!confirmDelete) return;

        boulderMap.delete(boulder.baseKey);
        if (!savedStore.deleted.includes(boulder.baseKey)) {
          savedStore.deleted.push(boulder.baseKey);
        }
        delete savedStore.edits[boulder.baseKey];
        savedStore.created = savedStore.created.filter(c => c && (c.baseKey !== boulder.baseKey && c.id !== boulder.baseKey));

        persistSavedStore();
        await deleteBoulderPhoto(`${boulder.sector}||${boulder.name}`);
        customToposMap.delete(`${boulder.sector}||${boulder.name}`);

        map.closePopup();
        refreshCollections();
        populateDropdowns();
        render();
      }

      // Move Pin on Map Mode (Drag Pin or Tap Map)
      const movePinBanner = document.getElementById("movePinBanner");
      const cancelMovePinBtn = document.getElementById("cancelMovePinBtn");
      let movingBoulder = null;
      let movingMarker = null;

      function startMovePinMode(boulder) {
        movingBoulder = boulder;
        map.closePopup();
        movingMarker = currentMarkerByKey.get(boulder.baseKey);
        if (!movingMarker) return;

        movePinBanner.classList.add("active");
        document.getElementById("movePinText").textContent = `Drag marker or tap map to place "${boulder.name}"`;

        const iconEl = movingMarker.getElement();
        if (iconEl) {
          const inner = iconEl.querySelector(".marker-boulder");
          if (inner) inner.classList.add("moving-pin");
        }

        movingMarker.dragging.enable();

        movingMarker.once("dragend", e => {
          const newPos = e.target.getLatLng();
          finishMovePin(newPos.lat, newPos.lng);
        });

        map.once("click", e => {
          if (!movingBoulder) return;
          finishMovePin(e.latlng.lat, e.latlng.lng);
        });
      }

      function finishMovePin(lat, lon) {
        if (!movingBoulder) return;
        const b = movingBoulder;
        b.lat = lat;
        b.lon = lon;
        b.displayLat = lat;
        b.displayLon = lon;
        b.estimated = false;

        if (b.isCustom) {
          const rec = savedStore.created.find(c => c && (c.baseKey === b.baseKey || c.id === b.baseKey));
          if (rec) {
            rec.lat = lat;
            rec.lon = lon;
          }
        } else {
          if (!savedStore.edits[b.baseKey]) {
            savedStore.edits[b.baseKey] = {
              name: b.name,
              problems: b.problems,
              comments: b.comments
            };
          }
          savedStore.edits[b.baseKey].lat = lat;
          savedStore.edits[b.baseKey].lon = lon;
        }

        persistSavedStore();
        cancelMovePin();
        refreshCollections();
        render();

        const updatedMarker = currentMarkerByKey.get(b.baseKey);
        if (updatedMarker) updatedMarker.openPopup();
      }

      function cancelMovePin() {
        if (movingMarker && movingMarker.dragging) movingMarker.dragging.disable();
        movePinBanner.classList.remove("active");
        movingBoulder = null;
        movingMarker = null;
      }

      cancelMovePinBtn.addEventListener("click", cancelMovePin);

      // Wire Popup Controls (Photos, Lines, Topo Highlighting, Move Pin, Delete)
      function wirePopupControls(popup, boulder) {
        if (!popup || !boulder) return;
        const el = popup.getElement();
        if (!el) return;

        const boulderKey = `${boulder.sector}||${boulder.name}`;
        const box = el.querySelector(".popup-box");
        if (box && window.L && L.DomEvent) {
          L.DomEvent.disableClickPropagation(box);
          L.DomEvent.disableScrollPropagation(box);
        }

        // Delete button in popup
        const delBtn = el.querySelector(".popup-delete-btn");
        if (delBtn) delBtn.addEventListener("click", () => deleteBoulder(boulder));

        // SVG topo hover/tap bidirectional highlighting
        const svgOverlay = el.querySelector(".topo-svg-overlay");
        const probItems = el.querySelectorAll(".problem-item");
        const topoGroups = el.querySelectorAll(".topo-svg-group");

        function highlightProblemAndLine(probIdx) {
          probItems.forEach(item => {
            const match = parseInt(item.dataset.probIdx, 10) === probIdx;
            item.classList.toggle("is-line-active", match);
          });
          if (svgOverlay) {
            svgOverlay.classList.toggle("has-highlight", probIdx !== null);
          }
          topoGroups.forEach(g => {
            const match = parseInt(g.dataset.probIdx, 10) === probIdx;
            g.classList.toggle("is-highlighted", match);
          });
        }

        probItems.forEach(item => {
          const idx = parseInt(item.dataset.probIdx, 10);
          item.addEventListener("mouseenter", () => highlightProblemAndLine(idx));
          item.addEventListener("mouseleave", () => highlightProblemAndLine(null));
          item.addEventListener("click", () => highlightProblemAndLine(idx));
        });

        topoGroups.forEach(g => {
          const idx = parseInt(g.dataset.probIdx, 10);
          g.addEventListener("mouseenter", () => highlightProblemAndLine(idx));
          g.addEventListener("mouseleave", () => highlightProblemAndLine(null));
          g.addEventListener("click", ev => {
            ev.stopPropagation();
            highlightProblemAndLine(idx);
          });
        });

        // Photo Upload / Replace
        const fileInput = el.querySelector(".popup-photo-input");
        if (fileInput) {
          fileInput.addEventListener("change", async ev => {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            try {
              const dataUrl = await readAndResizePhoto(file);
              await saveBoulderPhoto(boulderKey, dataUrl);
              popup.setContent(buildBoulderPopup(boulder, gradeFilterEl.value, searchFilterEl.value.trim().toLowerCase()));
              popup.update();
              wirePopupControls(popup, boulder);
            } catch (err) {
              console.error("Photo save failed:", err);
            }
          });
        }

        // Draw Line button
        const drawBtn = el.querySelector(".popup-draw-btn");
        if (drawBtn) {
          drawBtn.addEventListener("click", () => {
            const imgEl = el.querySelector(".popup-boulder-img");
            const src = imgEl ? (imgEl.currentSrc || imgEl.src) : (customPhotosMap.get(boulderKey) || boulder.image_url || "");
            if (src) openDrawLineModal(boulder, popup, src);
          });
        }

        // Reset Photo
        const resetPhotoBtn = el.querySelector(".popup-reset-photo");
        if (resetPhotoBtn) {
          resetPhotoBtn.addEventListener("click", async () => {
            await deleteBoulderPhoto(boulderKey);
            popup.setContent(buildBoulderPopup(boulder, gradeFilterEl.value, searchFilterEl.value.trim().toLowerCase()));
            popup.update();
            wirePopupControls(popup, boulder);
          });
        }

        // Edit button
        const editBtn = el.querySelector(".popup-edit-btn");
        if (editBtn) {
          editBtn.addEventListener("click", () => {
            popup.setContent(buildBoulderEditFormHtml(boulder));
            popup.update();
            wireEditFormControls(popup, boulder);
          });
        }
      }

      function wireEditFormControls(popup, boulder) {
        if (!popup || !boulder) return;
        const el = popup.getElement();
        if (!el) return;

        const form = el.querySelector(".popup-edit-form");
        if (!form) return;

        const probList = form.querySelector(".pe-prob-list");
        const addProbBtn = form.querySelector(".pe-add-prob");
        const cancelBtn = form.querySelector(".pe-cancel-btn");
        const deleteBtn = form.querySelector(".pe-delete-btn");
        const movePinBtn = form.querySelector(".pe-move-pin-btn");
        const useGpsBtn = form.querySelector(".pe-use-gps-btn");
        const errorBox = form.querySelector(".pe-error");

        if (deleteBtn) deleteBtn.addEventListener("click", () => deleteBoulder(boulder));

        if (movePinBtn) {
          movePinBtn.addEventListener("click", () => startMovePinMode(boulder));
        }

        if (useGpsBtn) {
          useGpsBtn.addEventListener("click", () => {
            if (lastGpsPos) {
              form.querySelector(".pe-lat").value = lastGpsPos.lat.toFixed(6);
              form.querySelector(".pe-lon").value = lastGpsPos.lng.toFixed(6);
              return;
            }
            if (!navigator.geolocation) return alert("Geolocation not supported");
            useGpsBtn.textContent = "Locating...";
            navigator.geolocation.getCurrentPosition(
              pos => {
                useGpsBtn.innerHTML = "&#127919; Use Current GPS";
                lastGpsPos = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
                form.querySelector(".pe-lat").value = pos.coords.latitude.toFixed(6);
                form.querySelector(".pe-lon").value = pos.coords.longitude.toFixed(6);
              },
              err => {
                useGpsBtn.innerHTML = "&#127919; Use Current GPS";
                alert("GPS error: " + (err ? err.message : "Permission denied"));
              },
              { enableHighAccuracy: true, timeout: 10000 }
            );
          });
        }

        function wireDeletes() {
          probList.querySelectorAll(".pe-del-prob").forEach(btn => {
            btn.onclick = () => btn.closest(".pe-prob-card").remove();
          });
        }
        wireDeletes();

        addProbBtn.addEventListener("click", () => {
          probList.insertAdjacentHTML("beforeend", buildProblemEditCard("", "", ""));
          wireDeletes();

        cancelBtn.addEventListener("click", () => {
          popup.setContent(buildBoulderPopup(boulder, gradeFilterEl.value, searchFilterEl.value.trim().toLowerCase()));

          wirePopupControls(popup, boulder);
        });

        form.addEventListener("submit", async ev => {
          ev.preventDefault();
          const newArea = (form.querySelector(".pe-area").value || "").trim() || "Malveira";
          const newSector = (form.querySelector(".pe-sector").value || "").trim();
          const newName = (form.querySelector(".pe-name").value || "").trim();
          const newComments = (form.querySelector(".pe-comments").value || "").trim();
          const latVal = parseFloat(form.querySelector(".pe-lat").value);
          const lonVal = parseFloat(form.querySelector(".pe-lon").value);

          if (!newName || !newSector) {
            errorBox.textContent = "Boulder name and sector are required.";

            return;

          const newProblems = [];
          probList.querySelectorAll(".pe-prob-card").forEach(card => {
            const pName = (card.querySelector(".pe-prob-name").value || "").trim();
            const pGrade = normalizeGrade(card.querySelector(".pe-prob-grade").value);
            const pDesc = (card.querySelector(".pe-prob-desc").value || "").trim();
            if (pName || pGrade) {
              newProblems.push({
                name: pName || "?",
                grade: pGrade,
                desc: pDesc
              });
              if (pGrade && pGrade !== "?") gradesSet.add(pGrade);
            }
          });

          const oldPhotoKey = `${boulder.sector}||${boulder.name}`;
          const newPhotoKey = `${newSector}||${newName}`;

          boulder.area = newArea;
          boulder.sector = newSector;
          boulder.name = newName;
          boulder.comments = newComments;
          boulder.problems = newProblems;

          if (Number.isFinite(latVal) && Number.isFinite(lonVal)) {
            boulder.lat = latVal;
            boulder.lon = lonVal;
            boulder.displayLat = latVal;
            boulder.displayLon = lonVal;
            boulder.estimated = false;
          }

          if (oldPhotoKey !== newPhotoKey) {
            if (customPhotosMap.has(oldPhotoKey)) {
              const photo = customPhotosMap.get(oldPhotoKey);
              await saveBoulderPhoto(newPhotoKey, photo);
              await deleteBoulderPhoto(oldPhotoKey);
            }
            if (customToposMap.has(oldPhotoKey)) {
              const topos = customToposMap.get(oldPhotoKey);
              await saveBoulderTopos(newPhotoKey, topos);
              customToposMap.delete(oldPhotoKey);
            }
          }

          if (boulder.isCustom) {
            const target = savedStore.created.find(c => c && (c.baseKey === boulder.baseKey || c.id === boulder.baseKey));
            if (target) {
              target.area = newArea;
              target.sector = newSector;
              target.name = newName;
              target.comments = newComments;
              target.problems = newProblems;
              target.lat = boulder.lat;
              target.lon = boulder.lon;
            }
          } else {
            savedStore.edits[boulder.baseKey] = {
              area: newArea,
              sector: newSector,
              name: newName,
              comments: newComments,
              problems: newProblems,
              lat: boulder.lat,
              lon: boulder.lon,
              updatedAt: Date.now()
            };
          }

          persistSavedStore();
          areasSet.add(newArea);
          sectorsSet.add(newSector);
          refreshCollections();
          populateDropdowns();
          render();

          const m = currentMarkerByKey.get(boulder.baseKey);
          if (m) m.openPopup();
        });
      }

      map.on("popupopen", e => {
        const marker = e.popup && e.popup._source;
        if (marker && marker._boulderRef) {
          wirePopupControls(e.popup, marker._boulderRef);
        }
      });

      // + Add New Boulder Modal
      const addBoulderModal = document.getElementById("addBoulderModal");
      const addBoulderBtn = document.getElementById("addBoulderBtn");
      const nbCloseBtn = document.getElementById("nbCloseBtn");
      const nbCancelBtn = document.getElementById("nbCancelBtn");
      const nbSaveBtn = document.getElementById("nbSaveBtn");
      const nbAreaEl = document.getElementById("nbArea");
      const nbSectorEl = document.getElementById("nbSector");
      const nbNameEl = document.getElementById("nbName");
      const nbLatEl = document.getElementById("nbLat");
      const nbLonEl = document.getElementById("nbLon");
      const nbUseGpsBtn = document.getElementById("nbUseGpsBtn");
      const nbPhotoInput = document.getElementById("nbPhotoInput");
      const nbPhotoPreview = document.getElementById("nbPhotoPreview");
      const nbProblemsContainer = document.getElementById("nbProblemsContainer");
      const nbAddProbBtn = document.getElementById("nbAddProbBtn");
      const nbCommentsEl = document.getElementById("nbComments");
      const nbErrorEl = document.getElementById("nbError");

      let pendingNbPhotoDataUrl = "";

      function addNbProblemRow(nameVal, gradeVal, descVal) {
        nbProblemsContainer.insertAdjacentHTML("beforeend", buildProblemEditCard(nameVal || "", gradeVal || "", descVal || ""));
        nbProblemsContainer.querySelectorAll(".pe-del-prob").forEach(b => {
          b.onclick = () => b.closest(".pe-prob-card").remove();
        });
      }

      function openAddBoulderModal() {
        nbAreaEl.value = areaSelect.value !== "ALL" ? areaSelect.value : "Malveira";
        nbSectorEl.value = sectorSelect.value !== "ALL" ? sectorSelect.value : "";
        nbNameEl.value = "";
        nbCommentsEl.value = "";
        pendingNbPhotoDataUrl = "";
        nbPhotoPreview.removeAttribute("src");
        nbPhotoPreview.style.display = "none";
        nbProblemsContainer.innerHTML = "";
        addNbProblemRow("", "", "");
        nbErrorEl.classList.remove("visible");

        if (lastGpsPos) {
          nbLatEl.value = lastGpsPos.lat.toFixed(6);
          nbLonEl.value = lastGpsPos.lng.toFixed(6);
        } else {
          const c = map.getCenter();
          nbLatEl.value = c.lat.toFixed(6);
          nbLonEl.value = c.lng.toFixed(6);

        addBoulderModal.classList.add("open");

      function closeAddBoulderModal() {

      }

      addBoulderBtn.addEventListener("click", openAddBoulderModal);
      nbCloseBtn.addEventListener("click", closeAddBoulderModal);
      nbCancelBtn.addEventListener("click", closeAddBoulderModal);
      nbAddProbBtn.addEventListener("click", () => addNbProblemRow("", "", ""));

      nbPhotoInput.addEventListener("change", async e => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        pendingNbPhotoDataUrl = await readAndResizePhoto(f);

      nbUseGpsBtn.addEventListener("click", () => {
